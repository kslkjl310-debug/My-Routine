<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Tools</title>
<meta name="theme-color" content="#1a1b1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Tools">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  /* Layout: one app shell. Desktop = graphite icon rail + label panel + tool area; phone = slim header + tool area + bottom tab bar.
     Each tool runs inside the shell (same-origin page), so switching never leaves the app. */
  :root{
    color-scheme: light;
    --rail-bg:#1a1b1f; --rail-icon-idle:#5d606b; --rail-icon-hover:#8b8e99; --rail-hover-bg:#25262c;
    --panel-bg:#212227; --panel-border:#2c2d33; --panel-hover:#26272e;
    --ink:#f1f2f5; --ink2:#b4b6c0; --muted:#7c7f8a;
    --accent:#38bdf8; --accent-ink:#7fd4fb; --accent-soft:#2c2e36; --accent-grad-a:#38bdf8; --accent-grad-b:#6366f1;
    --topbar-bg:#ffffff; --topbar-border:#e9e9ec; --topbar-muted:#8a8b94; --topbar-ink:#1a1b1f;
    --content-bg:#f6f6f8;
    --tab-bg:#1a1b1f; --tab-idle:#8b8e99; --tab-active:#38bdf8;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", Pretendard, Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html,body{height:100%;}
  html{background:var(--rail-bg);padding-top:env(safe-area-inset-top,0px);}
  body{margin:0;background:var(--content-bg);color:var(--topbar-ink);font-family:var(--font);overflow:hidden;font-size:14px;}
  .shell{display:flex;height:100%;}

  /* ---- icon rail (desktop) ---- */
  .rail{position:relative;z-index:30;width:56px;flex-shrink:0;background:var(--rail-bg);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:8px;}
  .rail-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;
    color:var(--rail-icon-idle);background:transparent;border:none;transition:background .12s ease,color .12s ease;}
  .rail-icon:hover{background:var(--rail-hover-bg);color:var(--rail-icon-hover);}
  .rail-icon.active{background:var(--accent-soft);color:var(--accent);}
  .rail-icon.brand{background:linear-gradient(135deg,var(--accent-grad-a),var(--accent-grad-b));color:#fff;cursor:default;margin-bottom:4px;}
  .rail-icon:focus-visible,.tool-item:focus-visible,.tab:focus-visible,.top-btn:focus-visible,.g-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* ---- label panel (desktop) ---- */
  .panel{width:220px;flex-shrink:0;background:var(--panel-bg);border-right:1px solid var(--panel-border);display:flex;flex-direction:column;padding:16px 12px;overflow-y:auto;}
  .panel-cat-title{font-size:14px;font-weight:700;color:var(--ink);padding:2px 8px 12px;}
  .tool-item{display:flex;align-items:center;gap:8px;width:100%;padding:8px 9px;border-radius:8px;font:600 12.5px var(--font);
    color:var(--ink2);cursor:pointer;background:none;border:none;text-align:left;}
  .tool-item:hover{background:var(--panel-hover);}
  .tool-item.active{background:var(--accent-soft);color:var(--accent-ink);}
  .tool-item .dot{width:5px;height:5px;border-radius:50%;background:#3a3b42;flex-shrink:0;}
  .tool-item.active .dot{background:var(--accent);}
  .panel-note{margin-top:auto;font-size:11px;line-height:1.55;color:var(--muted);padding:10px 8px 2px;border-top:1px solid var(--panel-border);}

  /* ---- main ---- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{min-height:44px;flex-shrink:0;background:var(--topbar-bg);border-bottom:1px solid var(--topbar-border);display:flex;align-items:center;padding:0 18px;gap:10px;}
  .crumb{font-size:12.5px;color:var(--topbar-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .crumb b{color:var(--topbar-ink);font-weight:700;}
  .brand-mini{display:none;}
  .top-r{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .conn{font-size:11px;font-weight:700;white-space:nowrap;padding:3px 9px;border-radius:999px;background:#eef1f4;color:#5a5c66;}
  .conn.ok{background:#e6f6ea;color:#1d7a3a;}
  .conn.bad{background:#fff1dc;color:#9a5600;}
  .who{font-size:12px;color:var(--topbar-muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .top-btn{font:700 12px var(--font);border:1px solid var(--topbar-border);background:#fff;color:var(--topbar-ink);border-radius:999px;padding:5px 11px;cursor:pointer;white-space:nowrap;}
  .top-btn:hover{background:#f3f4f7;}
  .frame-wrap{flex:1;position:relative;background:var(--content-bg);min-height:0;}
  .frame-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:var(--content-bg);}

  /* ---- 로그인 / 설정 안내 ---- */
  .gate{position:fixed;inset:0;z-index:100;background:var(--rail-bg);display:flex;align-items:center;justify-content:center;padding:24px max(20px,env(safe-area-inset-left,0px)) 24px max(20px,env(safe-area-inset-right,0px));}
  .gate-card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px;color:var(--ink);}
  .gate-logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--accent-grad-a),var(--accent-grad-b));color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;}
  .gate h1{margin:0;font-size:24px;letter-spacing:-.01em;}
  .gate p{margin:0;font-size:14px;line-height:1.6;color:var(--ink2);}
  .g-btn{min-height:46px;border-radius:12px;border:1px solid #3a3b42;background:#26272e;color:var(--ink);font:700 15px var(--font);cursor:pointer;padding:0 16px;}
  .g-btn.primary{background:var(--accent);border-color:var(--accent);color:#06222f;}
  .g-err{font-size:13px;color:#ffb36b;min-height:18px;line-height:1.5;}
  .g-link{background:none;border:0;color:var(--accent-ink);font:600 13px var(--font);text-decoration:underline;text-underline-offset:3px;cursor:pointer;align-self:flex-start;padding:0;}
  .g-steps{margin:0;padding-left:20px;font-size:13px;line-height:1.7;color:var(--ink2);}

  /* ---- bottom tab bar (phone) ---- */
  .tabbar{display:none;}
  @media (max-width:820px){
    .rail,.panel{display:none;}
    .topbar{padding:0 14px;min-height:46px;}
    .who{display:none;}
    .brand-mini{display:flex;width:26px;height:26px;border-radius:7px;align-items:center;justify-content:center;font-size:13px;color:#fff;
      background:linear-gradient(135deg,var(--accent-grad-a),var(--accent-grad-b));flex-shrink:0;}
    .tabbar{display:flex;flex-shrink:0;background:var(--tab-bg);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px,env(safe-area-inset-left,0px));gap:4px;}
    .tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;border:none;background:none;border-radius:10px;
      color:var(--tab-idle);font:700 11px var(--font);cursor:pointer;}
    .tab .ic{font-size:19px;line-height:1;filter:grayscale(1);opacity:.75;}
    .tab.active{color:var(--tab-active);background:var(--accent-soft);}
    .tab.active .ic{filter:none;opacity:1;}
  }
</style>
</head>
<body>

<div class="shell">
  <nav class="rail" aria-label="카테고리">
    <div class="rail-icon brand" title="My Tools">⌘</div>
    <button class="rail-icon active" data-cat="routine" title="루틴" aria-label="루틴">✅</button>
    <button class="rail-icon" data-cat="competency" title="역량관리" aria-label="역량관리">🎯</button>
    <button class="rail-icon" data-cat="finance" title="재정관리" aria-label="재정관리">💰</button>
    <button class="rail-icon" data-cat="faith" title="신앙관리" aria-label="신앙관리">🙏</button>
  </nav>

  <aside class="panel">
    <div class="cat-view" data-cat-view="routine">
      <div class="panel-cat-title">루틴</div>
      <button class="tool-item active" data-tool="routine"><span class="dot"></span>오늘의 루틴</button>
    </div>
    <div class="cat-view" data-cat-view="competency" hidden>
      <div class="panel-cat-title">역량관리</div>
      <button class="tool-item" data-tool="planner"><span class="dot"></span>역량 성장 플래너</button>
      <button class="tool-item" data-tool="opic"><span class="dot"></span>OPIc 스피킹 트레이너</button>
      <button class="tool-item" data-tool="reading"><span class="dot"></span>독서 체크</button>
    </div>
    <div class="cat-view" data-cat-view="finance" hidden>
      <div class="panel-cat-title">재정관리</div>
      <button class="tool-item" data-tool="budget"><span class="dot"></span>우리집 가계부</button>
    </div>
    <div class="cat-view" data-cat-view="faith" hidden>
      <div class="panel-cat-title">신앙관리</div>
      <button class="tool-item" data-tool="bible"><span class="dot"></span>성경 읽기 체크</button>
    </div>
    <div class="panel-note" id="panelNote"></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="brand-mini" aria-hidden="true">⌘</div>
      <div class="crumb"><span id="crumbCat">루틴</span> / <b id="crumbTool">오늘의 루틴</b></div>
      <div class="top-r">
        <button class="top-btn" id="installBtn" hidden>앱으로 설치</button>
        <span class="conn" id="conn">확인 중…</span>
        <span class="who" id="who"></span>
        <button class="top-btn" id="logoutBtn" hidden>로그아웃</button>
      </div>
    </div>
    <div class="frame-wrap" id="frames"></div>
    <nav class="tabbar" aria-label="도구">
      <button class="tab active" data-tool="routine"><span class="ic">✅</span>루틴</button>
      <button class="tab" data-tool="planner"><span class="ic">🎯</span>플래너</button>
      <button class="tab" data-tool="opic"><span class="ic">🎙️</span>OPIc</button>
      <button class="tab" data-tool="reading"><span class="ic">📚</span>독서</button>
      <button class="tab" data-tool="budget"><span class="ic">🏡</span>가계부</button>
      <button class="tab" data-tool="bible"><span class="ic">📖</span>성경</button>
    </nav>
  </div>
</div>

<div class="gate" id="gate">
  <div class="gate-card" id="gateCard"></div>
</div>

<script src="firebase-config.js"></script>
<script src="backend.js"></script>
<script>
  const TOOLS = {
    routine: { cat: 'routine',     name: '오늘의 루틴', src: 'routine.html' },
    planner: { cat: 'competency',  name: '역량 성장 플래너', src: 'planner.html' },
    opic:    { cat: 'competency',  name: 'OPIc 스피킹 트레이너', src: 'opic.html' },
    reading: { cat: 'competency',  name: '독서 체크', src: 'reading.html', unit: '분' },
    budget:  { cat: 'finance',     name: '우리집 가계부', src: 'budget.html' },
    bible:   { cat: 'faith',       name: '성경 읽기 체크', src: 'bible.html', unit: '장' }
  };
  const CAT_LABEL = { routine: '루틴', competency: '역량관리', finance: '재정관리', faith: '신앙관리' };
  const CAT_DEFAULT = { routine: 'routine', competency: 'planner', finance: 'budget', faith: 'bible' };
  const frames = {};
  const $ = (id) => document.getElementById(id);
  const prefs = { get(){ try { return localStorage.getItem('hub-tool'); } catch(e){ return null; } }, set(v){ try { localStorage.setItem('hub-tool', v); } catch(e){} } };
  let current = null;

  // 도구는 처음 열 때 한 번만 불러오고, 전환할 땐 숨겼다 보여서 작업 중인 화면이 그대로 유지된다
  function frameFor(key){
    if (!frames[key]) {
      const f = document.createElement('iframe');
      f.src = TOOLS[key].src;
      f.title = TOOLS[key].name;
      f.hidden = true;
      f.addEventListener('load', () => { frameLoadedAt[key] = Date.now(); });
      $('frames').appendChild(f);
      frames[key] = f;
    }
    return frames[key];
  }
  function select(key){
    const t = TOOLS[key]; if (!t) return;
    Object.keys(frames).forEach(k => { frames[k].hidden = k !== key; });
    frameFor(key).hidden = false;
    document.querySelectorAll('.rail-icon[data-cat]').forEach(b => b.classList.toggle('active', b.dataset.cat === t.cat));
    document.querySelectorAll('.cat-view').forEach(v => { v.hidden = v.dataset.catView !== t.cat; });
    document.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === key));
    $('crumbCat').textContent = CAT_LABEL[t.cat];
    $('crumbTool').textContent = t.name;
    prefs.set(key);
    current = key;
  }
  document.querySelectorAll('.rail-icon[data-cat]').forEach(b => b.addEventListener('click', () => { if (adapters) select(CAT_DEFAULT[b.dataset.cat]); }));
  document.querySelectorAll('[data-tool]').forEach(b => b.addEventListener('click', () => { if (adapters) select(b.dataset.tool); }));

  /* ---------- 도구 화면 ↔ 저장소 중계 ----------
     허브 안의 도구들은 메시지로 부탁하고, 허브가 저장소(db)·사용자·파일 저장을 대신 호출해 결과를 돌려준다. */
  let adapters = null; // 로그인(또는 이 기기 전용 시작) 뒤에 채워진다
  function cap(name){ return Promise.resolve(adapters ? (adapters[name] || null) : null); }
  const errObj = (e) => ({ code: (e && e.code) || 'unavailable', message: (e && e.message) || String(e) });
  function serDoc(s){ return { kind: 'doc', id: s.id, exists: !!s.exists, data: s.exists ? s.data() : null, metadata: { fromCache: !!(s.metadata && s.metadata.fromCache), hasPendingWrites: !!(s.metadata && s.metadata.hasPendingWrites) } }; }
  function serCol(s){ return { kind: 'col', docs: s.docs.map(d => ({ id: d.id, exists: true, data: d.data() })), metadata: { fromCache: !!(s.metadata && s.metadata.fromCache) } }; }
  const liveSubs = new Map(); // "frameKey:subId" -> unsubscribe
  function frameKeyOf(win){ return Object.keys(frames).find(k => frames[k].contentWindow === win); }

  /* ---------- 도구별 오늘의 기록 활동 ----------
     도구가 저장할 때마다 날짜·도구별로 센다. 루틴 화면이 이 기록을 읽어서 연결된 루틴을 자동으로 체크한다.
     도구를 막 연 직후 5초 안의 저장과, 3초 안에 연달아 일어난 저장은 한 번의 활동으로 본다. */
  const frameLoadedAt = {}, actLast = {};
  let actLoad = null, actTimer = 0;
  const dayKey = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  async function loadActivity(){
    const db = await cap('db'), user = await cap('user');
    if (!db || !user) return null;
    const uid = await user.id(); if (!uid) return null;
    const ref = db.doc('data/users/' + uid + '/hub-activity'), s = await ref.get();
    const d0 = s.exists ? (s.data() || {}) : {};
    return { ref, days: d0.days || {}, meas: d0.meas || {} };
  }
  function saveAct(a){
    clearTimeout(actTimer);
    actTimer = setTimeout(() => { a.ref.set(JSON.parse(JSON.stringify({ days: a.days, meas: a.meas }))).catch(() => {}); }, 800);
  }
  // 도구가 "그날 이만큼 했다"는 수치(예: 읽은 장 수)를 알려 주면 날짜·도구별로 남긴다
  async function reportMeasure(key, r){
    if (!r || typeof r.value !== 'number' || !isFinite(r.value) || !/^\d{4}-\d{2}-\d{2}$/.test(r.date || '')) return;
    try {
      if (!actLoad) actLoad = loadActivity();
      const a = await actLoad; if (!a) return;
      if (((a.meas[r.date] || {})[key]) === r.value) return;
      a.meas[r.date] = a.meas[r.date] || {}; a.meas[r.date][key] = r.value;
      const ks = Object.keys(a.meas).sort(); while (ks.length > 120) delete a.meas[ks.shift()];
      saveAct(a);
    } catch (e) {}
  }
  async function noteActivity(key){
    if (key === 'routine') return;
    const now = Date.now(), recent = now - (actLast[key] || 0) < 3000;
    actLast[key] = now;
    if (recent || now - (frameLoadedAt[key] || 0) < 5000) return;
    try {
      if (!actLoad) actLoad = loadActivity();
      const a = await actLoad; if (!a) return;
      const d = dayKey(); a.days[d] = a.days[d] || {}; a.days[d][key] = (a.days[d][key] || 0) + 1;
      const ks = Object.keys(a.days).sort(); while (ks.length > 120) delete a.days[ks.shift()];
      saveAct(a);
    } catch (e) {}
  }
  const toolList = () => Object.keys(TOOLS).filter(k => TOOLS[k].cat !== 'routine').map(k => ({ key: k, name: TOOLS[k].name, cat: TOOLS[k].cat, catName: CAT_LABEL[TOOLS[k].cat], unit: TOOLS[k].unit || '' }));

  async function handle(m){
    if (m.cap === 'hub' && m.op === 'tools') return toolList();
    if (m.cap === 'hub' && m.op === 'caps') {
      const out = {};
      for (const n of ['db', 'user', 'sample', 'downloads']) out[n] = !!(await cap(n));
      return out;
    }
    const c = await cap(m.cap);
    if (!c) throw { code: 'not_granted', message: m.cap + ' unavailable' };
    const a = m.args || [];
    switch (m.cap + '.' + m.op) {
      case 'db.docGet': return serDoc(await c.doc(a[0]).get());
      case 'db.docSet': await c.doc(a[0]).set(a[1]); return null;
      case 'db.docUpdate': await c.doc(a[0]).update(a[1]); return null;
      case 'db.docDel': await c.doc(a[0]).delete(); return null;
      case 'db.colGet': { let q = c.collection(a[0]); if (a[1]) q = q.limit(a[1]); return serCol(await q.get()); }
      case 'user.id': return await c.id();
      case 'downloads.save': return await c.save(a[0]);
    }
    throw { code: 'invalid_argument', message: 'unknown call ' + m.cap + '.' + m.op };
  }
  window.addEventListener('message', async (e) => {
    const m = e.data;
    if (!m || !m.__hub) return;
    const key = frameKeyOf(e.source);
    if (!key) return; // 허브 안의 도구 화면이 보낸 메시지만 처리
    const src = e.source;
    const reply = (o) => { try { src.postMessage(Object.assign({ __hubr: 1 }, o), '*'); } catch (err) {} };
    if (m.nav) { if (TOOLS[m.nav]) select(m.nav); return; } // 루틴 화면이 연결된 도구로 바로 이동
    if (m.report) { if (key !== 'routine') reportMeasure(key, m.report); return; }
    if (m.unsub) {
      const k = key + ':' + m.unsub, u = liveSubs.get(k);
      if (u) { u(); liveSubs.delete(k); }
      return;
    }
    if (m.sub) {
      const db = await cap('db');
      if (!db) { reply({ sub: m.sub, err: { code: 'not_granted', message: 'db unavailable' } }); return; }
      try {
        let ref = m.kind === 'doc' ? db.doc(m.path) : db.collection(m.path);
        if (m.kind !== 'doc' && m.lim) ref = ref.limit(m.lim);
        const un = ref.onSnapshot(
          s => reply({ sub: m.sub, snap: m.kind === 'doc' ? serDoc(s) : serCol(s) }),
          err => reply({ sub: m.sub, err: errObj(err) })
        );
        liveSubs.set(key + ':' + m.sub, un);
      } catch (err) { reply({ sub: m.sub, err: errObj(err) }); }
      return;
    }
    m.__key = key;
    try {
      const val = await handle(m);
      reply({ id: m.id, val });
      if (m.cap === 'db' && (m.op === 'docSet' || m.op === 'docUpdate' || m.op === 'docDel')) noteActivity(key);
    }
    catch (err) { reply({ id: m.id, err: errObj(err) }); }
  });

  /* ---------- 상태 표시 ---------- */
  let mode = null; // 'firebase' | 'local'
  function updateConn(){
    const el = $('conn');
    if (mode === 'local') { el.className = 'conn bad'; el.textContent = '이 기기에만 저장'; }
    else if (mode === 'firebase' && !navigator.onLine) { el.className = 'conn bad'; el.textContent = '오프라인 · 연결되면 동기화'; }
    else if (mode === 'firebase') { el.className = 'conn ok'; el.textContent = '✓ 동기화됨'; }
    else { el.className = 'conn'; el.textContent = '확인 중…'; }
  }
  window.addEventListener('online', updateConn);
  window.addEventListener('offline', updateConn);

  /* ---------- 시작: 로그인 / 이 기기 전용 ---------- */
  const gateEl = $('gate'), gateCard = $('gateCard');
  function gate(html){ gateCard.innerHTML = html; gateEl.hidden = false; }
  const LOGO = '<div class="gate-logo">⌘</div>';
  function showSetup(){
    gate(LOGO + '<h1>My Tools</h1>' +
      '<p>아직 Firebase 설정이 비어 있어서 로그인과 동기화는 꺼져 있어요. 먼저 이 기기에서만 써 볼 수 있어요.</p>' +
      '<ol class="g-steps"><li>README의 순서대로 Firebase 프로젝트를 만들어요.</li><li>나온 설정값을 <b>firebase-config.js</b>에 붙여 넣고 다시 올려요.</li></ol>' +
      '<button class="g-btn primary" id="gLocal">이 기기에서만 써 보기</button>');
    $('gLocal').onclick = () => startLocal();
  }
  function showLogin(msg){
    gate(LOGO + '<h1>My Tools</h1><p>루틴, 신앙관리, 역량관리, 재정관리를 한곳에서. 로그인하면 폰과 PC가 같은 데이터를 써요.</p>' +
      '<button class="g-btn primary" id="gGoogle">Google로 로그인</button>' +
      '<div class="g-err" id="gErr" role="alert">' + (msg || '') + '</div>' +
      '<button class="g-link" id="gLocal">로그인 없이 이 기기에서만 쓰기</button>');
    $('gGoogle').onclick = async () => {
      $('gErr').textContent = '';
      try { await Backend.signIn(); }
      catch (e) {
        const c = e && e.code;
        $('gErr').textContent = c === 'auth/unauthorized-domain' ? '이 주소가 Firebase의 승인된 도메인에 없어요. README 6번을 확인해 주세요.'
          : c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request' ? '로그인 창이 닫혔어요. 다시 눌러 주세요.'
          : '로그인하지 못했어요. 잠시 뒤 다시 시도해 주세요. (' + (c || '오류') + ')';
      }
    };
    $('gLocal').onclick = () => startLocal();
  }
  function showLoading(t){ gate(LOGO + '<p>' + t + '</p>'); }

  let started = false;
  function startApp(who){
    adapters = who.adapters; mode = who.mode;
    $('who').textContent = who.label || '';
    $('logoutBtn').hidden = false;
    $('panelNote').textContent = mode === 'firebase' ? '모든 도구의 데이터는 로그인한 계정에 자동 저장되고, 오프라인에서도 쓸 수 있어요.' : '지금은 로그인 없이 이 기기의 브라우저에만 저장돼요. 다른 기기와는 동기화되지 않아요.';
    gateEl.hidden = true;
    updateConn();
    if (started) return; started = true;
    const saved = prefs.get();
    select(TOOLS[saved] ? saved : 'routine');
  }
  function startLocal(){
    Backend.setMode('local');
    const a = Backend.localAdapters();
    startApp({ adapters: a, mode: 'local', label: '이 기기' });
  }
  async function startFirebase(){
    showLoading('불러오는 중…');
    try {
      await Backend.startFirebase((u) => {
        if (u) startApp({ adapters: Backend.firebaseAdapters(u), mode: 'firebase', label: u.email || u.displayName || '' });
        else if (!started) showLogin('');
        else location.reload();
      });
    } catch (e) {
      gate(LOGO + '<h1>My Tools</h1><p>로그인 도구를 불러오지 못했어요. 인터넷 연결을 확인하고 다시 열어 주세요.</p>' +
        '<button class="g-btn primary" id="gRetry">다시 시도</button><button class="g-link" id="gLocal">이 기기에서만 쓰기</button>');
      $('gRetry').onclick = () => startFirebase(); $('gLocal').onclick = () => startLocal();
    }
  }
  $('logoutBtn').addEventListener('click', async () => {
    if (mode === 'firebase') { try { await Backend.signOut(); } catch (e) {} }
    else Backend.setMode(null);
    location.reload();
  });

  // 폰·PC에 설치
  let installEvt = null;
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; $('installBtn').hidden = false; });
  $('installBtn').addEventListener('click', async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch (e) {} installEvt = null; $('installBtn').hidden = true; });
  window.addEventListener('appinstalled', () => { $('installBtn').hidden = true; });

  if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }

  (function boot(){
    const m = Backend.savedMode();
    if (m === 'local') startLocal();
    else if (Backend.hasConfig) startFirebase();
    else showSetup();
  })();
</script>
</body>
</html>
