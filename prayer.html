<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>중보기도 관리</title>
<script>
/* 허브 안에서 열렸을 때: 허브(부모 화면)에게 메시지로 부탁해서 계정 저장소를 쓰고, 다른 영역의 도구로 이동한다.
   (My Tools Hub의 다른 도구들과 같은 방식) */
(function () {
  if (window.parent === window) return;
  document.documentElement.classList.add('emb');
  var P = window.parent, seq = 0, pending = {}, subs = {};
  function post(m) { m.__hub = 1; P.postMessage(m, '*'); }
  function call(cap, op, args) {
    return new Promise(function (res, rej) {
      var id = ++seq; pending[id] = { res: res, rej: rej };
      post({ id: id, cap: cap, op: op, args: args || [] });
    });
  }
  function docSnap(d) {
    var body = d.data;
    return { id: d.id, exists: !!d.exists, metadata: d.metadata || {},
      data: function () { return body == null ? undefined : JSON.parse(JSON.stringify(body)); } };
  }
  function wrap(s) {
    if (!s) return s;
    if (s.kind === 'doc') return docSnap(s);
    var docs = (s.docs || []).map(docSnap);
    return { docs: docs, size: docs.length, empty: !docs.length, metadata: s.metadata || {}, docChanges: function () { return []; } };
  }
  window.addEventListener('message', function (e) {
    if (e.source !== P) return;
    var m = e.data; if (!m || !m.__hubr) return;
    if (m.sub) { var s = subs[m.sub]; if (!s) return; if (m.err) { if (s.err) s.err(m.err); } else s.next(wrap(m.snap)); return; }
    var p = pending[m.id]; if (!p) return; delete pending[m.id];
    if (m.err) p.rej(m.err); else p.res(m.val);
  });
  function subscribe(kind, path, lim, next, err) {
    var id = ++seq; subs[id] = { next: next, err: err };
    post({ sub: id, kind: kind, path: path, lim: lim || null });
    return function () { delete subs[id]; post({ unsub: id }); };
  }
  function docRef(path) {
    return {
      id: path.split('/').pop(), path: path,
      get: function () { return call('db', 'docGet', [path]).then(wrap); },
      set: function (d) { return call('db', 'docSet', [path, d]); },
      update: function (d) { return call('db', 'docUpdate', [path, d]); },
      'delete': function () { return call('db', 'docDel', [path]); },
      collection: function (sub) { return colRef(path + '/' + sub); },
      onSnapshot: function (next, err) { return subscribe('doc', path, null, next, err); }
    };
  }
  function colRef(path, lim) {
    return {
      path: path,
      doc: function (id) { return docRef(path + '/' + (id || (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)))); },
      limit: function (n) { return colRef(path, n); },
      get: function () { return call('db', 'colGet', [path, lim || null]).then(wrap); },
      onSnapshot: function (next, err) { return subscribe('col', path, lim, next, err); }
    };
  }
  var capsP = null;
  function caps() {
    if (!capsP) capsP = new Promise(function (res) {
      var done = false;
      call('hub', 'caps', []).then(function (c) { done = true; res(c || {}); }, function () { done = true; res({}); });
      setTimeout(function () { if (!done) res({}); }, 12000);
    });
    return capsP;
  }
  var api = {
    use: function (name) {
      return caps().then(function (c) {
        if (!c[name]) return null;
        if (name === 'db') return { doc: docRef, collection: function (p) { return colRef(p); } };
        if (name === 'user') return {
          id: function () { return call('user', 'id', []); },
          isOwner: function () { return false; }, canEdit: function () { return false; }, can: function () { return null; }
        };
        if (name === 'downloads') return { save: function (r) { return call('downloads', 'save', [{ filename: r.filename, data: r.data }]); } };
        return null;
      });
    }
  };
  window.__hubClaude = api;
  window.__hubNav = function (key) { post({ nav: key }); };
  window.__hubTools = function () { return call('hub', 'tools', []); };
  // 도구가 "오늘 이만큼 했다"는 수치를 알려 주면 허브가 계정에 남기고, 루틴이 그 수치로 자동 체크한다
  window.__hubReport = function (r) { post({ report: r }); };
})();
</script>
<style>

  .heat i.f { visibility: hidden; }

<body>
<div class="wrap" id="root"></div>
<div id="sheet"></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
(function () {
  'use strict';

  var CATS = ['가족', '친구·지인', '교회·공동체', '선교·나라', '직장·학업', '기타'];
  var DOWN = ['일', '월', '화', '수', '목', '금', '토'];
  var KEY = 'prayer-v1', HEAT = 18 * 7, KEEP_DAYS = 420;

  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var keyOf = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var todayKey = function () { return keyOf(new Date()); };
  var parseKey = function (k) { var p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2], 12); };
  var addDays = function (k, n) { var d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
  var dowOf = function (k) { return parseKey(k).getDay(); };
  var dayDiff = function (a, b) { return Math.round((parseKey(b) - parseKey(a)) / 864e5); };
  var isDate = function (s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s)); };
  var short = function (k) { return k.slice(5).replace('-', '/'); };
  var clone = function (o) { return JSON.parse(JSON.stringify(o)); };
  var uid = function () { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); };

  /* ---------- 상태 ----------
     items[]: { id, who, title, cat, days[] (비어 있으면 매일), start, status: open | answered | paused,
                answeredAt, answerMemo, notes[{d,t}], prayed[날짜] } */
  function normItem(x) {
    if (!x || typeof x !== 'object') return null;
    var who = String(x.who || '').trim().slice(0, 40), title = String(x.title || '').trim().slice(0, 400);
    if (!who && !title) return null;
    var days = Array.isArray(x.days) ? x.days.map(Number).filter(function (n, i, a) { return n >= 0 && n <= 6 && a.indexOf(n) === i; }).sort() : [];
    if (days.length === 7) days = [];
    var prayed = (Array.isArray(x.prayed) ? x.prayed : []).filter(isDate).filter(function (d, i, a) { return a.indexOf(d) === i; }).sort();
    var status = x.status === 'answered' || x.status === 'paused' ? x.status : 'open';
    return {
      id: String(x.id || uid()), who: who, title: title, cat: CATS.indexOf(x.cat) >= 0 ? x.cat : '기타', days: days,
      start: isDate(x.start) ? x.start : todayKey(), status: status,
      answeredAt: status === 'answered' && isDate(x.answeredAt) ? x.answeredAt : '', answerMemo: String(x.answerMemo || '').slice(0, 400),
      notes: (Array.isArray(x.notes) ? x.notes : []).filter(function (n) { return n && isDate(n.d) && String(n.t || '').trim(); }).map(function (n) { return { d: n.d, t: String(n.t).slice(0, 300) }; }).slice(-60),
      prayed: prayed
    };
  }
  function normalize(j) {
    var out = { v: 1, updatedAt: (j && j.updatedAt) || 0, items: [] };
    ((j && Array.isArray(j.items)) ? j.items : []).forEach(function (x) { var it = normItem(x); if (it) out.items.push(it); });
    return out;
  }
  function readLocal() { try { var raw = localStorage.getItem(KEY); if (raw) return normalize(JSON.parse(raw)); } catch (e) {} return normalize(null); }
  function writeLocal() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  var state = readLocal();
  var tab = 'today', recDate = todayKey(), openId = null, sheet = null, pendingImport = null;

  /* ---------- 계산 ---------- */
  function byId(id) { for (var i = 0; i < state.items.length; i++) if (state.items[i].id === id) return state.items[i]; return null; }
  function isDue(it, k) { return it.status === 'open' && it.start <= k && (!it.days.length || it.days.indexOf(dowOf(k)) >= 0); }
  function dueList(k) { return state.items.filter(function (it) { return isDue(it, k); }); }
  function prayedOn(it, k) { return it.prayed.indexOf(k) >= 0; }
  function countOn(k) { var n = 0; state.items.forEach(function (it) { if (prayedOn(it, k)) n++; }); return n; }
  function byDate() { var m = {}; state.items.forEach(function (it) { it.prayed.forEach(function (d) { m[d] = (m[d] || 0) + 1; }); }); return m; }
  function streak(m) { var k = todayKey(), n = 0; if (!m[k]) k = addDays(k, -1); while (m[k]) { n++; k = addDays(k, -1); } return n; }
  var level = function (n) { return n <= 0 ? 0 : n <= 2 ? 1 : n <= 5 ? 2 : n <= 9 ? 3 : 4; };
  function weekStart(k) { return addDays(k, -((dowOf(k) + 6) % 7)); }
  function daysText(days) { return days.length ? days.map(function (d) { return DOWN[d]; }).join('·') : '매일'; }
  function lastPrayed(it) { return it.prayed.length ? it.prayed[it.prayed.length - 1] : ''; }
  function prune() { // 오래된 기도 기록은 지난 14개월까지만 남긴다
    var from = addDays(todayKey(), -KEEP_DAYS);
    state.items.forEach(function (it) { if (it.prayed.length && it.prayed[0] < from) it.prayed = it.prayed.filter(function (d) { return d >= from; }); });
  }

  /* ---------- 저장·동기화 (허브가 계정 저장소를 중계) ---------- */
  var CL = window.__hubClaude || window.claude;
  var remote = null, pushTimer = 0, pushing = false, dirty = false;
  function setSaved(kind) {
    var el = $('#saved'); if (!el) return;
    el.className = 'saved' + (kind === 'busy' ? ' busy' : kind === 'local' ? ' local' : '');
    el.textContent = kind === 'busy' ? '저장 중…' : kind === 'local' ? '이 기기에만 저장됨' : '저장됨';
  }
  var savedKind = 'local';
  function schedulePush() { if (!remote) return; dirty = true; savedKind = 'busy'; setSaved('busy'); clearTimeout(pushTimer); pushTimer = setTimeout(push, 700); }
  async function push() {
    if (pushing) { pushTimer = setTimeout(push, 400); return; }
    if (!dirty || !remote) return;
    pushing = true; dirty = false;
    try { await remote.set(clone(state)); if (!dirty) { savedKind = 'ok'; setSaved('ok'); } } catch (e) { savedKind = 'local'; setSaved('local'); }
    pushing = false;
    if (dirty) schedulePush();
  }
  async function initRemote() {
    try {
      if (!CL || !CL.use) return;
      var db = await CL.use('db'), user = await CL.use('user');
      if (!db || !user) return;
      var id = await user.id(); if (!id) return;
      remote = db.doc('data/users/' + id + '/prayer-intercession');
      var snap = await remote.get();

  /* 제목 추가·수정, 응답 기록 시트 */

  function readSheetFields() {

  async function updateExportBtn() {

  /* ---------- 이벤트 ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]'); if (!t) return;
    var act = t.dataset.act, id = t.dataset.id, it = id && byId(id);
    if (act === 'sheet-bg') { if (e.target === t) { sheet = null; renderSheet(); } return; }
    if (act === 'tab') { tab = t.dataset.t; render(); }
    else if (act === 'open') { openId = openId === id ? null : id; render(); }
    else if (act === 'pray' && it) {
      var k = tab === 'today' ? recDate : todayKey(), i = it.prayed.indexOf(k);
      if (i >= 0) it.prayed.splice(i, 1); else { it.prayed.push(k); it.prayed.sort(); }
      commit([k]);
    }
    else if (act === 'pray-all') {
      var kk = recDate, n = 0;
      dueList(kk).forEach(function (x) { if (!prayedOn(x, kk)) { x.prayed.push(kk); x.prayed.sort(); n++; } });
      commit([kk]); toast(n + '건을 기도한 것으로 기록했어요');
    }
    else if (act === 'add') { sheet = { kind: 'edit', id: '', who: '', title: '', cat: '가족', days: [], start: todayKey() }; renderSheet(); }
    else if (act === 'edit' && it) { sheet = { kind: 'edit', id: it.id, who: it.who, title: it.title, cat: it.cat, days: it.days.slice(), start: it.start }; renderSheet(); }
    else if (act === 'sh-cat') { readSheetFields(); sheet.cat = t.dataset.c; renderSheet(); }

      sheet.days.sort(); if (sheet.days.length === 7) sheet.days = []; renderSheet();

      if (sheet.id) { var cur = byId(sheet.id); if (cur) { cur.who = who; cur.title = title; cur.cat = sheet.cat; cur.days = sheet.days.slice(); cur.start = sheet.start; } }
      else { var ni = normItem({ id: uid(), who: who, title: title, cat: sheet.cat, days: sheet.days, start: sheet.start, status: 'open' }); state.items.unshift(ni); openId = ni.id; tab = 'today'; }

  document.addEventListener('keydown', function (e) {

    } catch (e) { if (!e || e.code !== 'declined') toast('이 화면에서는 파일을 저장할 수 없어요'); }
  }

  render();
  initRemote();
  reportDay(todayKey());
})();
</script>
</body>
