<title>러닝 관리</title>
<script>
/* 허브 안에서 열렸을 때: 허브(부모 화면)에게 메시지로 부탁해서 계정 저장소를 쓰고, 다른 영역의 도구로 이동한다.
   (My Tools Hub의 다른 도구들과 같은 방식) */
(function () {
  if (window.parent === window) return;
  document.documentElement.classList.add('emb');
  var P = window.parent, seq = 0, pending = {}, subs = {};
  function post(m) { m.__hub = 1; P.postMessage(m, '*'); }
  function call(cap, op, args) {
    return new Promise(function (res, rej) {
      var id = ++seq; pending[id] = { res: res, rej: rej };
      post({ id: id, cap: cap, op: op, args: args || [] });
    });
  }
  function docSnap(d) {
    var body = d.data;
    return { id: d.id, exists: !!d.exists, metadata: d.metadata || {},
      data: function () { return body == null ? undefined : JSON.parse(JSON.stringify(body)); } };
  }
  function wrap(s) {
    if (!s) return s;
    if (s.kind === 'doc') return docSnap(s);
    var docs = (s.docs || []).map(docSnap);
    return { docs: docs, size: docs.length, empty: !docs.length, metadata: s.metadata || {}, docChanges: function () { return []; } };
  }
  window.addEventListener('message', function (e) {
    if (e.source !== P) return;
    var m = e.data; if (!m || !m.__hubr) return;
    if (m.sub) { var s = subs[m.sub]; if (!s) return; if (m.err) { if (s.err) s.err(m.err); } else s.next(wrap(m.snap)); return; }
    var p = pending[m.id]; if (!p) return; delete pending[m.id];
    if (m.err) p.rej(m.err); else p.res(m.val);
  });
  function subscribe(kind, path, lim, next, err) {
    var id = ++seq; subs[id] = { next: next, err: err };
    post({ sub: id, kind: kind, path: path, lim: lim || null });
    return function () { delete subs[id]; post({ unsub: id }); };
  }
  function docRef(path) {
    return {
      id: path.split('/').pop(), path: path,
      get: function () { return call('db', 'docGet', [path]).then(wrap); },
      set: function (d) { return call('db', 'docSet', [path, d]); },
      update: function (d) { return call('db', 'docUpdate', [path, d]); },
      'delete': function () { return call('db', 'docDel', [path]); },
      collection: function (sub) { return colRef(path + '/' + sub); },
      onSnapshot: function (next, err) { return subscribe('doc', path, null, next, err); }
    };
  }
  function colRef(path, lim) {
    return {
      path: path,
      doc: function (id) { return docRef(path + '/' + (id || (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)))); },
      limit: function (n) { return colRef(path, n); },
      get: function () { return call('db', 'colGet', [path, lim || null]).then(wrap); },
      onSnapshot: function (next, err) { return subscribe('col', path, lim, next, err); }
    };
  }
  var capsP = null;
  function caps() {

      var done = false;
      call('hub', 'caps', []).then(function (c) { done = true; res(c || {}); }, function () { done = true; res({}); });
      setTimeout(function () { if (!done) res({}); }, 12000);
    });
    return capsP;
  }
  var api = {
    use: function (name) {
      return caps().then(function (c) {

        };

        return null;
      });
    }
  };
  window.__hubClaude = api;
  window.__hubNav = function (key) { post({ nav: key }); };
  window.__hubTools = function () { return call('hub', 'tools', []); };
  // 도구가 "오늘 이만큼 했다"는 수치를 알려 주면 허브가 계정에 남기고, 루틴이 그 수치로 자동 체크한다
  window.__hubReport = function (r) { post({ report: r }); };
})();

  add({ id: 'hrtemp', k: ['!!심박과기온', '!!기온과심박', '!!온도와심박', '!!심박과온도', '!!심박수와기온', '!!기온과심박수', '!!더우면심박', '!!더울때심박', '!!더운날심박', '!!기온에따른심박', '!!기온별심박', '!!날씨와심박', '!!심박과날씨', '!!기온이심박', '!!온도가심박'], rel: ['더울 땐 어떻게 달려요?', '이지런 페이스가 어떻게 돼?'],

        var best = null;
        for (var i = 0; i < rs.length; i++) for (var j = i + 1; j < rs.length; j++) {

  add({ id: 'shoes', k: ['!러닝화', '!신발', '!운동화', '!쿠션', '!카본', '!양말', '!교체', '!깔창', '!발볼', '!사이즈'], rel: ['무릎이 아파요', '발톱이 아파요'],

  add({ id: 'strength', k: ['!근력', '!스트레칭', '!코어', '!스쿼트', '!런지', '!폼롤러', '!웨이트', '!크로스트레이닝', '!요가', '!필라테스', '!자전거', '!수영', '!보강운동', '!플랭크', '!풀업'], rel: ['워밍업은 어떻게 해요?', '무릎이 아파요'],

  add({ id: 'warmup', k: ['!워밍업', '!준비운동', '!쿨다운', '!정리운동', '!몸풀기', '!달리기전에', '!달리고나서'], rel: ['근력 운동은 뭐가 좋아요?', '템포런은 어떻게 해?'],
    run: function () { return H(['<b>워밍업(약 10분)</b>', '- 5분 걷기 또는 아주 느린 조깅', '- 동적 스트레칭 3~5분: 레그 스윙, 하이니, 런지 워크, 발목 돌리기', '- 템포·인터벌·대회 날은 가속주(20초 가볍게 속도 올리기) 2~4번', '<b>쿨다운(5~10분)</b>', '- 걷거나 아주 천천히 조깅해 심박을 내려요.', '- 그 뒤 종아리·햄스트링·허벅지 앞·엉덩이를 20~30초씩 정적 스트레칭해요.', '편한 이지런은 처음 5분을 천천히 달리는 것이 곧 워밍업이에요.']); } });

  add({ id: 'form', k: ['!자세', '!호흡', '!숨이', '!숨차', '!착지', '!팔치기', '!팔을', '!보폭', '!케이던스', '!미드풋', '!앞꿈치', '!뒤꿈치착지', '!코로', '!입으로', '!시선', '!러닝폼'], rel: ['케이던스가 뭐야?', '무릎이 아파요'],
    run: function (q, e, A) {

      return H(['<b>러닝 자세 기본</b>', '- <b>시선</b>은 15~20m 앞, 턱은 가볍게, 어깨는 힘을 빼요.', '- <b>팔</b>은 90도로 가볍게 앞뒤로(몸 중심선을 넘지 않게), 주먹은 달걀을 쥔 느낌.', '- <b>상체</b>는 발목에서부터 아주 조금 앞으로 기울여요(허리를 숙이지 않기).', '- <b>착지</b>는 발이 몸 바로 아래에 떨어지게. 뒤꿈치·미드풋 어느 쪽이든 <b>몸보다 앞에 멀리 딛지 않는 것</b>이 핵심이에요. 억지로 앞꿈치 착지로 바꾸면 종아리·아킬레스를 다칠 수 있어요.', '- <b>케이던스</b>(분당 걸음 수)는 160~180 사이가 많아요. 보폭이 너무 크면 5% 정도 올려 보세요.', '자세를 바꾸려면 한꺼번에 하지 말고 한 가지씩, 짧은 구간에서 연습해요.']); } });

  add({ id: 'weight', k: ['!체중', '!다이어트', '!살빼', '!살이', '!감량', '!지방', '!칼로리소모', '!칼로리가', '!몸무게'], rel: ['이번 달 칼로리는?', '러닝 후엔 뭘 먹어요?'],

  add({ id: 'time', k: ['!아침에', '!저녁에', '!새벽', '!밤에', '!야간', '!몇시에', '!시간대', '!언제달', '!수면', '!잠을', '!잠이'], rel: ['더울 땐 어떻게 달려요?', '쉬어야 할까요?'],
    run: function (q, e, A) {
      var qs = q.replace(/\s+/g, '');
      if (/수면|잠/.test(qs)) return H(['수면은 훈련만큼 중요해요. <b>하루 7~9시간</b>, 힘든 훈련 주에는 더 자요. 수면이 부족하면 같은 페이스에서 심박이 오르고, 회복이 느려지고, 부상 위험이 커져요. 늦은 시간 카페인과 화면을 줄이고, 대회 전 3일은 특히 일찍 자요(대회 전날은 잠이 안 와도 괜찮아요. 그 전날 잠이 더 중요해요).']);
      return H(['<b>달리는 시간은 “꾸준히 할 수 있는 때”가 정답</b>이에요. 장단점은 이래요.', '- <b>아침</b>: 시원하고 일정이 안 밀려요. 몸이 뻣뻣하니 워밍업을 길게, 아침 식사는 가볍게(바나나 정도).', '- <b>저녁</b>: 몸이 풀려 있어 속도를 내기 좋고 기록이 잘 나와요. 너무 늦으면 수면에 영향을 줘요.', '- 대회가 아침이라면 <b>대회 2~3주 전부터 같은 시간대에 달려</b> 몸을 적응시키세요.', '- 야간에는 밝은 색 옷과 반사 용품, 헤드램프를 쓰고, 이어폰 볼륨을 낮춰 주변 소리를 들어요.']); } });

  add({ id: 'faster', k: ['!빨라지', '!빨라져', '!빨라질', '!빨리뛰', '!빨리달', '!기록단축', '!기록향상', '!기록이안', '!정체', '!늘지않', '!안늘어', '!속도를올', '!속도올', '!더빨리', '!페이스를올', '!페이스올', '!페이스를줄', '!실력향상', '!빨리달리'], rel: ['템포런은 어떻게 해?', '이지런이 너무 빠른가요?'],
    run: function (q, e, A) {

      return H(L);

  add({ id: 'hrmax', k: ['!최대심박', '!220', '!나이로', '!maxhr', '!안정시심박', '!안정심박'], rel: ['내 심박 구간이 어떻게 돼요?', '심박이 너무 높게 나와요'],

  add({ id: 'terrain', k: ['!트레드밀', '!러닝머신', '!오르막', '!내리막', '!언덕길', '!트랙에서', '!경사', '!계단', '!산길', '!트레일', '!실내'], rel: ['날씨가 안 좋을 땐?', '무릎이 아파요'],

      return H(['<b>오르막</b>에서는 보폭을 줄이고 케이던스를 유지하며, <b>페이스가 아니라 같은 힘(호흡)</b>으로 올라가요. 언덕에서 느려지는 건 정상이에요. 시선은 앞 5~10m, 팔을 조금 더 흔들어요.', '완만한 언덕 반복(힐 리피트)은 근력과 달리기 효율을 키워 주는 좋은 훈련이에요.']); } });

    else if (act === 'export') exportBackup();
    else if (act === 'import-yes') { if (pendingImport) { var ts = state.updatedAt, ds = Object.keys(kmByDate()); state = pendingImport.data; state.updatedAt = Math.max(Date.now(), ts + 1); pendingImport = null; commit(ds.concat(Object.keys(kmByDate()))); var nsp = sum(state.runs, function (r) { return (r.splits || []).length; }), ncd = state.runs.filter(function (r) { return r.cadence; }).length; toast('백업에서 복원했어요. 러닝 ' + state.runs.length + '번 · 케이던스 ' + ncd + '번 · 구간기록 ' + nsp + '줄', 6000); } }
    else if (act === 'import-no') { pendingImport = null; render(); }
  });
  document.addEventListener('input', function (e) { if (/^rn-(km|min|sec)$/.test(e.target.id)) updatePace(); else if (e.target.id === 'gl-pace-in') updateGoalPace('pace'); else if (/^gl-(dist|h|m|s)$/.test(e.target.id)) updateGoalPace('time'); else if (/^pl-m-/.test(e.target.id)) updatePlanTotal(); });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.pdate) { // 종류를 바꾸면 거리 칸을 맞춰 준다: 휴식이면 비우고, 처음 고르면 코치 제안 거리를 넣는다
      var mi = $('#pl-m-' + t.dataset.pdate);
      if (t.value === 'rest') mi.value = ''; else if (!(+mi.value > 0)) mi.value = { easy: 4, tempo: 5, long: 8, interval: 5, rp: 5 }[t.value] || 4;
      updatePlanTotal(); return;
    }
    if (t.id === 'rn-shot' && t.files && t.files.length) { readShots(Array.prototype.slice.call(t.files, 0, 8)); t.value = ''; return; }
    if (t.id === 'importFile' && t.files && t.files[0]) {
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var j = JSON.parse(String(fr.result || ''));
          if (!j || !Array.isArray(j.runs)) throw new Error('bad');
          var data = normalize(j); pendingImport = { data: data, n: data.runs.length }; render();
        } catch (err) { toast('읽을 수 없는 파일이에요. 내보내기로 저장한 파일을 골라 주세요.'); }
      };
      fr.readAsText(t.files[0]);
    }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#scrim').hidden) closeSheet(); });
  async function updateExportBtn() { var b = $('#exportBtn'); if (!b) return; try { var d = CL && CL.use ? await CL.use('downloads') : null; b.hidden = !d; } catch (e) { b.hidden = true; } }
  async function exportBackup() {
    try { var d = await CL.use('downloads'); await d.save({ filename: 'running-check-' + todayKey() + '.json', data: JSON.stringify(state, null, 1) }); toast('백업 파일을 저장했어요'); }
    catch (e) { if (!e || e.code !== 'declined') toast('이 화면에서는 파일을 저장할 수 없어요'); }
  }

  render();
  initRemote();
  reportWeeks();
})();
</script>
</body>
</html>
