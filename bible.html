<script>
/* 허브 안에서 열렸을 때: 허브(부모 화면)에게 메시지로 부탁해서 계정 저장소를 쓰고, 다른 영역의 도구로 이동한다.
   (My Tools Hub의 다른 도구들과 같은 방식) */

    });
  }
  function docSnap(d) {
    var body = d.data;
    return { id: d.id, exists: !!d.exists, metadata: d.metadata || {},
      data: function () { return body == null ? undefined : JSON.parse(JSON.stringify(body)); } };
  }
  function wrap(s) {
    if (!s) return s;
    if (s.kind === 'doc') return docSnap(s);
    var docs = (s.docs || []).map(docSnap);
    return { docs: docs, size: docs.length, empty: !docs.length, metadata: s.metadata || {}, docChanges: function () { return []; } };
  }

    if (e.source !== P) return;

    var id = ++seq; subs[id] = { next: next, err: err };
    post({ sub: id, kind: kind, path: path, lim: lim || null });
    return function () { delete subs[id]; post({ unsub: id }); };
  }
  function docRef(path) {
    return {
      id: path.split('/').pop(), path: path,
      get: function () { return call('db', 'docGet', [path]).then(wrap); },
      set: function (d) { return call('db', 'docSet', [path, d]); },
      update: function (d) { return call('db', 'docUpdate', [path, d]); },
      'delete': function () { return call('db', 'docDel', [path]); },

  function colRef(path, lim) {
    return {
      path: path,
      doc: function (id) { return docRef(path + '/' + (id || (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)))); },

      return caps().then(function (c) {

    }

  window.__hubTools = function () { return call('hub', 'tools', []); };

  window.__hubReport = function (r) { post({ report: r }); };
})();

    var s = stats(), t = todayKey(), p = s.total / TOTAL * 100, nx = nextUnread();
    var pctTxt = s.total === 0 ? '0' : (p < 10 ? p.toFixed(1) : String(Math.round(p)));
    var h = '<div class="head"><h1>성경 읽기 체크</h1><div class="tools"><span class="saved' + (savedKind === 'busy' ? ' busy' : savedKind === 'local' ? ' local' : '') + '" id="saved">' + (savedKind === 'busy' ? '저장 중…' : savedKind === 'local' ? '이 기기에만 저장됨' : '저장됨') + '</span>' +
      '<button type="button" class="btn" data-act="export" id="exportBtn" hidden>내보내기</button>' +
      '<label class="btn">불러오기<input type="file" id="importFile" accept=".json,application/json" hidden></label></div></div>';
    if (pendingImport) h += '<div class="bar-note" role="alert"><span>백업 파일에 ' + fmt(pendingImport.count) + '장의 기록이 있어요. 지금 기록을 이 파일로 덮어쓸까요?</span><span class="acts"><button type="button" class="btn" data-act="import-yes">덮어쓰기</button><button type="button" class="btn" data-act="import-no">취소</button></span></div>';

    h += '<section class="card total"><div class="total-r"><span class="pct num">' + pctTxt + '<small>%</small></span><span class="cnt num"><b>' + fmt(s.total) + '</b> / ' + fmt(TOTAL) + '장 읽음</span><span class="left num">' + fmt(TOTAL - s.total) + '장 남음</span></div>' +
      '<div class="bar' + (s.total === TOTAL ? ' done' : '') + '"><i style="width:' + p + '%"></i></div>' +
      (nx ? '<div class="next"><span>다음 읽을 곳 <b>' + esc(nx.b.name) + ' ' + nx.c + '장</b></span><button type="button" class="btn sm" data-act="goto" data-b="' + esc(nx.b.name) + '">이어서 체크</button></div>' : '<div class="next"><b>성경 전체를 읽었어요.</b></div>') + '</section>';

    var otp = s.ot / TOT['구약'] * 100, ntp = s.nt / TOT['신약'] * 100, st = streak(s.byDate), td = s.byDate[t] || 0;
    h += '<div class="tiles">' +
      '<div class="tile"><span class="lb">구약</span><span class="v num">' + otp.toFixed(1) + '%<small>' + fmt(s.ot) + '/' + fmt(TOT['구약']) + '</small></span><div class="bar sm"><i style="width:' + otp + '%"></i></div></div>' +
      '<div class="tile"><span class="lb">신약</span><span class="v num">' + ntp.toFixed(1) + '%<small>' + fmt(s.nt) + '/' + fmt(TOT['신약']) + '</small></span><div class="bar sm"><i style="width:' + ntp + '%"></i></div></div>' +
      '<div class="tile"><span class="lb">연속 읽기</span><span class="v num">' + st + '<small>일</small></span></div>' +
      '<div class="tile"><span class="lb">오늘 읽은 장</span><span class="v num">' + td + '<small>장</small></span></div></div>';

    var start = addDays(addDays(t, -dowOf(t)), -(DOW - 7)), cells = '';
    for (var i = 0; i < DOW; i++) {
      var k = addDays(start, i), n = s.byDate[k] || 0;
      cells += k > t ? '<i class="f"></i>' : '<i class="l' + level(n) + (k === t ? ' t' : '') + '" title="' + k.slice(5).replace('-', '/') + ' · ' + n + '장"></i>';
    }
    h += '<section class="card"><div class="sec-t"><h2>최근 활동</h2><span>최근 18주 · 하루에 읽은 장 수</span></div><div class="heat-box"><div class="heat" role="img" aria-label="최근 18주 읽기 기록">' + cells + '</div></div>' +
      '<div class="legend"><span>적음</span>' + [0, 1, 2, 3, 4].map(function (l) { return '<i style="background:var(--h' + l + ')"></i>'; }).join('') + '<span>많음</span></div></section>';

    h += '<div class="ctl"><div class="seg" role="group" aria-label="구분">' + ['전체', '구약', '신약'].map(function (f) { return '<button type="button" data-act="filter" data-f="' + f + '" aria-pressed="' + (filter === f) + '">' + f + '</button>'; }).join('') + '</div>' +
      '<label class="datef">기록 날짜 <input type="date" id="recDate" value="' + recDate + '" max="' + t + '"></label></div>';

    h += '<div class="books">';
    G.forEach(function (g) {
      if (filter !== '전체' && g[0] !== filter) return;
      h += '<div class="gh">' + g[0] + ' · ' + g[1] + '</div>';
      g[2].forEach(function (bk) {
        var b = BYNAME[bk[0]], m = state.read[b.name] || {}, r = Object.keys(m).length, isOpen = !!open[b.name], full = r === b.n;
        h += '<div class="book' + (isOpen ? ' open' : '') + (full ? ' full' : '') + '" id="bk-' + esc(b.name) + '"><button type="button" class="bh" data-act="book" data-b="' + esc(b.name) + '" aria-expanded="' + isOpen + '"><span class="tri">▶</span><span class="nm">' + esc(b.name) + '</span><div class="bar sm' + (full ? ' done' : '') + '"><i style="width:' + (r / b.n * 100) + '%"></i></div><span class="cnt num">' + (full ? '✓ ' : '') + r + '/' + b.n + '</span></button>';
        if (isOpen) {
          h += '<div class="bd"><div class="chips">';
          for (var c = 1; c <= b.n; c++) {
            var d = m[c];
            h += '<button type="button" class="chip num' + (d ? ' on' : '') + (d === t ? ' today' : '') + '" data-act="ch" data-b="' + esc(b.name) + '" data-n="' + c + '" aria-pressed="' + !!d + '" title="' + (d ? d + ' 읽음' : '아직 안 읽음') + '">' + c + '</button>';
          }
          h += '</div><div class="bd-f"><button type="button" class="btn sm" data-act="all" data-b="' + esc(b.name) + '">남은 장 모두 읽음</button><button type="button" class="btn sm" data-act="none" data-b="' + esc(b.name) + '">이 책 기록 지우기</button><span class="hint">체크하면 ' + recDate.slice(5).replace('-', '/') + '(으)로 기록돼요</span></div></div>';
        }
        h += '</div>';
      });
    });
    h += '</div>';
    $('#root').innerHTML = h;
    updateExportBtn();
  }

  async function updateExportBtn() {
    var b = $('#exportBtn'); if (!b) return;
    try { var d = CL && CL.use ? await CL.use('downloads') : null; b.hidden = !d; } catch (e) { b.hidden = true; }
  }

  /* ---------- 이벤트 ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]'); if (!t) return;
    var act = t.dataset.act, bn = t.dataset.b, b = bn && BYNAME[bn];
    if (act === 'filter') { filter = t.dataset.f; render(); }
    else if (act === 'book') { open[bn] = !open[bn]; render(); }
    else if (act === 'goto') {
      if (filter !== '전체' && filter !== BYNAME[bn].t) filter = BYNAME[bn].t;
      open[bn] = true; render();
      var el = document.getElementById('bk-' + bn); if (el) { try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (x) {} }
    }
    else if (act === 'ch') {
      var m = state.read[bn] = state.read[bn] || {}, n = +t.dataset.n, d = recDate;
      if (m[n]) { d = m[n]; delete m[n]; } else m[n] = recDate;
      if (!Object.keys(m).length) delete state.read[bn];
      commit([d]);
    }
    else if (act === 'all') {
      var mm = state.read[bn] = state.read[bn] || {}, cnt = 0;
      for (var c = 1; c <= b.n; c++) if (!mm[c]) { mm[c] = recDate; cnt++; }
      commit([recDate]); toast(cnt + '장을 ' + recDate.slice(5).replace('-', '/') + '(으)로 기록했어요');
    }
    else if (act === 'none') {
      if (t.dataset.armed !== '1') { t.dataset.armed = '1'; t.textContent = '정말 지울까요?'; return; }
      var dates = Object.keys(state.read[bn] || {}).map(function (c) { return state.read[bn][c]; });
      delete state.read[bn]; commit(dates);
    }
    else if (act === 'export') exportBackup();
    else if (act === 'import-yes') { if (pendingImport) { var ts = state.updatedAt, old = stats().byDate; state = pendingImport.data; state.updatedAt = Math.max(Date.now(), ts + 1); pendingImport = null; commit(Object.keys(old)); toast('백업에서 복원했어요'); } }
    else if (act === 'import-no') { pendingImport = null; render(); }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'recDate') { var v = t.value; recDate = isDate(v) && v <= todayKey() ? v : todayKey(); render(); }
    else if (t.id === 'importFile' && t.files && t.files[0]) {
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var j = JSON.parse(String(fr.result || '')), data = normalize(j), count = 0;
          Object.keys(data.read).forEach(function (k) { count += Object.keys(data.read[k]).length; });
          if (!j || typeof j.read !== 'object') throw new Error('no read');
          pendingImport = { data: data, count: count }; render();
        } catch (err) { toast('읽을 수 없는 파일이에요. 내보내기로 저장한 파일을 골라 주세요.'); }
      };
      fr.readAsText(t.files[0]);
    }
  });
  async function exportBackup() {
    try {
      var d = await CL.use('downloads');
      await d.save({ filename: 'bible-read-' + todayKey() + '.json', data: JSON.stringify(state, null, 1) });
      toast('백업 파일을 저장했어요');
    } catch (e) { if (!e || e.code !== 'declined') toast('이 화면에서는 파일을 저장할 수 없어요'); }
  }

  render();
  initRemote();
  reportToday();
})();
</script>
</body>
</html>
