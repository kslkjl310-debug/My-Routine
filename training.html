<script>
/* 허브 안에서 열렸을 때: 허브(부모 화면)에게 메시지로 부탁해서 계정 저장소를 쓰고, 다른 영역의 도구로 이동한다.
   (My Tools Hub의 다른 도구들과 같은 방식) */
(function () {
  if (window.parent === window) return;
  document.documentElement.classList.add('emb');
  var P = window.parent, seq = 0, pending = {}, subs = {};
  function post(m) { m.__hub = 1; P.postMessage(m, '*'); }
  function call(cap, op, args) {
    return new Promise(function (res, rej) {
      var id = ++seq; pending[id] = { res: res, rej: rej };
      post({ id: id, cap: cap, op: op, args: args || [] });
    });
  }
  function docSnap(d) {
    var body = d.data;
    return { id: d.id, exists: !!d.exists, metadata: d.metadata || {},
      data: function () { return body == null ? undefined : JSON.parse(JSON.stringify(body)); } };
  }
  function wrap(s) {
    if (!s) return s;
    if (s.kind === 'doc') return docSnap(s);
    var docs = (s.docs || []).map(docSnap);
    return { docs: docs, size: docs.length, empty: !docs.length, metadata: s.metadata || {}, docChanges: function () { return []; } };
  }
  window.addEventListener('message', function (e) {
    if (e.source !== P) return;
    var m = e.data; if (!m || !m.__hubr) return;
    if (m.sub) { var s = subs[m.sub]; if (!s) return; if (m.err) { if (s.err) s.err(m.err); } else s.next(wrap(m.snap)); return; }
    var p = pending[m.id]; if (!p) return; delete pending[m.id];
    if (m.err) p.rej(m.err); else p.res(m.val);
  });
  function subscribe(kind, path, lim, next, err) {
    var id = ++seq; subs[id] = { next: next, err: err };
    post({ sub: id, kind: kind, path: path, lim: lim || null });
    return function () { delete subs[id]; post({ unsub: id }); };
  }
  function docRef(path) {
    return {
      id: path.split('/').pop(), path: path,
      get: function () { return call('db', 'docGet', [path]).then(wrap); },
      set: function (d) { return call('db', 'docSet', [path, d]); },
      update: function (d) { return call('db', 'docUpdate', [path, d]); },
      'delete': function () { return call('db', 'docDel', [path]); },
      collection: function (sub) { return colRef(path + '/' + sub); },
      onSnapshot: function (next, err) { return subscribe('doc', path, null, next, err); }
    };
  }
  function colRef(path, lim) {
    return {
      path: path,
      doc: function (id) { return docRef(path + '/' + (id || (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)))); },
      limit: function (n) { return colRef(path, n); },
      get: function () { return call('db', 'colGet', [path, lim || null]).then(wrap); },
      onSnapshot: function (next, err) { return subscribe('col', path, lim, next, err); }
    };
  }
  var capsP = null;
  function caps() {
    if (!capsP) capsP = new Promise(function (res) {
      var done = false;
      call('hub', 'caps', []).then(function (c) { done = true; res(c || {}); }, function () { done = true; res({}); });
      setTimeout(function () { if (!done) res({}); }, 12000);
    });
    return capsP;
  }
  var api = {
    use: function (name) {
      return caps().then(function (c) {
        if (!c[name]) return null;
        if (name === 'db') return { doc: docRef, collection: function (p) { return colRef(p); } };
        if (name === 'user') return {
          id: function () { return call('user', 'id', []); },
          isOwner: function () { return false; }, canEdit: function () { return false; }, can: function () { return null; }
        };
        if (name === 'downloads') return { save: function (r) { return call('downloads', 'save', [{ filename: r.filename, data: r.data }]); } };
        return null;
      });
    }
  };
  window.__hubClaude = api;
  window.__hubNav = function (key) { post({ nav: key }); };
  window.__hubTools = function () { return call('hub', 'tools', []); };
  // 도구가 "오늘 이만큼 했다"는 수치를 알려 주면 허브가 계정에 남기고, 루틴이 그 수치로 자동 체크한다
  window.__hubReport = function (r) { post({ report: r }); };
})();

<div class="wrap" id="root"></div>
<div class="player" id="player" hidden></div>

<script>
(function () {
  'use strict';
  var KEY = 'training-check-v1';
  var DOW = ['일', '월', '화', '수', '목', '금', '토'];
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var keyOf = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var todayKey = function () { return keyOf(new Date()); };
  var parseKey = function (k) { var p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2], 12); };
  var addDays = function (k, n) { var d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
  var isDate = function (s) { return /^\d{4}-\d{2}-\d{2}$/.test(s || ''); };
  var uid = function () { return 'f' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3); };
  var clone = function (o) { return JSON.parse(JSON.stringify(o)); };
  var cInt = function (v, a, b, d) { v = Math.round(+v); return isFinite(v) && v >= a && v <= b ? v : d; };
  var cNum = function (v, a, b, d) { v = +v; return isFinite(v) && v >= a && v <= b ? v : d; };
  var fmt = function (s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + pad(s % 60); };
  var fmtLong = function (sec) { var m = Math.round(sec / 60); if (m < 60) return m + '분'; return Math.floor(m / 60) + '시간 ' + (m % 60) + '분'; };
  var natural = function (a, b) { return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }); };

  /* ---------- 상태 ---------- */
  var DEF = { rep: 2, gap: 'len', rate: 1, sub: 'show', lang: 'both', marked: false, goal: 20, loop: false };
  function normalize(j) {
    j = j || {}; var st = j.settings || {}, out = { v: 1, updatedAt: +j.updatedAt || 0, sets: [], logs: {}, recent: [] };
    out.settings = {
      rep: cInt(st.rep, 1, 50, DEF.rep), gap: ['none', 'len', '2', '5'].indexOf(st.gap) >= 0 ? st.gap : DEF.gap, rate: cNum(st.rate, 0.5, 2, 1),
      sub: ['show', 'part', 'hide'].indexOf(st.sub) >= 0 ? st.sub : 'show', lang: ['both', 'en', 'ko'].indexOf(st.lang) >= 0 ? st.lang : 'both',
      marked: !!st.marked, goal: cInt(st.goal, 1, 600, DEF.goal), loop: !!st.loop
    };
    (Array.isArray(j.sets) ? j.sets : []).slice(0, 100).forEach(function (s) {
      if (!s || typeof s !== 'object') return;
      var tracks = (Array.isArray(s.tracks) ? s.tracks : []).slice(0, 600).map(function (t) {
        if (!t || !t.fid) return null;
        var start = cNum(t.start, 0, 86400, 0), end = cNum(t.end, 0, 86400, 0), dur = cNum(t.dur, 0, 86400, 0);
        return { id: String(t.id || uid()), fid: String(t.fid), fname: String(t.fname || '').slice(0, 160), fsize: +t.fsize || 0, name: String(t.name || '').slice(0, 120), start: start, end: end > start ? end : 0, dur: dur, mark: !!t.mark, text: String(t.text || '').slice(0, 4000), split: !!t.split };
      }).filter(Boolean);
      out.sets.push({ id: String(s.id || uid()), name: String(s.name || '이름 없는 자료').slice(0, 80), fav: !!s.fav, at: +s.at || 0, last: cInt(s.last, 0, 599, 0), tracks: tracks });
    });
    Object.keys(j.logs || {}).sort().slice(-800).forEach(function (d) { var l = j.logs[d]; if (isDate(d) && l) out.logs[d] = { sec: Math.max(0, Math.round(+l.sec || 0)), rep: Math.max(0, Math.round(+l.rep || 0)) }; });
    (Array.isArray(j.recent) ? j.recent : []).slice(0, 10).forEach(function (r) { if (r && r.setId) out.recent.push({ setId: String(r.setId), idx: cInt(r.idx, 0, 599, 0), at: +r.at || 0 }); });
    return out;
  }
  function readLocal() { try { var raw = localStorage.getItem(KEY); if (raw) return normalize(JSON.parse(raw)); } catch (e) {} return normalize(null); }
  function writeLocal() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  var state = readLocal(), tab = 'home', viewSet = '', have = {}, importTarget = '', sheet = null;

  /* ---------- 저장·동기화 (허브가 저장소를 중계). 소리 파일은 이 기기에만 저장하고, 자료 목록·기록은 계정에 저장한다 ---------- */
  var CL = window.__hubClaude || window.claude, remote = null, pushTimer = 0, pushing = false, dirty = false, savedKind = 'local';
  function setSaved() { var el = $('#saved'); if (!el) return; el.className = 'saved' + (savedKind === 'busy' ? ' busy' : savedKind === 'local' ? ' local' : ''); el.textContent = savedKind === 'busy' ? '저장 중…' : savedKind === 'local' ? '이 기기에만 저장됨' : '저장됨'; }
  function schedulePush() { if (!remote) return; dirty = true; savedKind = 'busy'; setSaved(); clearTimeout(pushTimer); pushTimer = setTimeout(push, 700); }
  async function push() {

      '<div class="field"><span class="lb">자막</span><div class="chips">' + [['show', '전체 보기'], ['part', '일부만 보기'], ['hide', '전체 가리기']].map(function (o) { return chip('sub', o[0], o[1]); }).join('') + '</div><div class="chips">' + [['both', '한글/영어'], ['en', '영어'], ['ko', '한글']].map(function (o) { return chip('lang', o[0], o[1]); }).join('') + '</div></div>' +
      '<div class="field"><span class="lb">하루 훈련 목표(분)</span><input type="number" id="cfg-goal" min="1" max="600" step="1" inputmode="numeric" value="' + c.goal + '" style="width:120px"><span class="help">루틴의 목표 시간은 루틴 화면에서 따로 정해요.</span></div></section>' +
      '<section class="card"><div class="sec-t"><h2>파일은 저장하지 않아요</h2></div><p class="help" style="line-height:1.7">mp3와 자막 파일은 앱에 복사해 두지 않고, 훈련할 때 <b>열어 둔 동안만</b> 써요. 계정에는 자료 이름, 문단 구성, 자막 글, ✓ 표시, 이어서 훈련할 위치, 훈련 기록만 저장돼요. 다음에 훈련할 때는 같은 mp3를 한 번 열어 주세요.</p></section>';
  }
  function render() {
    var h = '<div class="head"><h1>영어 훈련 플레이어' + (window.APP_VERSION ? ' <span class="ver">v' + esc(window.APP_VERSION) + '</span>' : '') + '</h1><span class="saved" id="saved"></span></div>';
    h += '<div class="tabs" role="tablist" aria-label="화면">' + [['home', '홈'], ['lib', '자료'], ['log', '기록'], ['cfg', '설정']].map(function (x) { return '<button type="button" role="tab" data-act="tab" data-t="' + x[0] + '" aria-selected="' + (tab === x[0]) + '">' + x[1] + '</button>'; }).join('') + '</div>';
    h += '<div class="pane">' + (tab === 'home' ? homePane() : tab === 'lib' ? libPane() : tab === 'log' ? logPane() : setPaneSettings()) + '</div>';
    var keep = window.pageYOffset; $('#root').innerHTML = h; setSaved(); window.scrollTo(0, keep);
  }
  async function storageInfoUnused() {
    var el = $('#cfg-store'); if (!el) return;
    try { var e = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : null, n = Object.keys(have).length; el.textContent = '저장된 mp3 ' + n + '개' + (e ? ' · 이 앱이 쓰는 공간 약 ' + Math.round((e.usage || 0) / 1048576) + 'MB (사용 가능 약 ' + Math.round(((e.quota || 0) - (e.usage || 0)) / 1048576) + 'MB)' : ''); } catch (x) { el.textContent = ''; }
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]'); if (!t || e.target.closest('#player')) return; var a = t.dataset.act, id = t.dataset.id;
    if (a === 'tab') { tab = t.dataset.t; if (tab !== 'lib') viewSet = ''; render(); window.scrollTo(0, 0); }
    else if (a === 'add-files') pickFiles('');
    else if (a === 'add-files-to') pickFiles(id);
    else if (a === 'open-set') { viewSet = id; tab = 'lib'; render(); window.scrollTo(0, 0); }
    else if (a === 'back-lib') { viewSet = ''; render(); }
    else if (a === 'play-set') { startSet(id, +t.dataset.i); }
    else if (a === 'open-subs') { var sinp = document.createElement('input'); sinp.type = 'file'; sinp.multiple = true; sinp.accept = '.smi,.sami,.srt,.vtt,.lrc,.txt,audio/*,.mp3'; sinp.onchange = function () { applySubs(sinp.files, setById(id)); }; sinp.click(); }
    else if (a === 'fav') { var s = setById(id); if (s) { s.fav = !s.fav; commit(); } }
    else if (a === 'rename') openSheet({ type: 'rename', id: id });
    else if (a === 'relink') { var rs = setById(id); if (rs) askOpen(rs, rs.last); }
    else if (a === 'del-set') { var ds = setById(id); if (ds) confirmBox('자료 삭제', '“' + ds.name + '” 자료(문단 구성과 자막)를 삭제할까요? 내 mp3 파일은 지워지지 않고, 훈련 기록은 남아요.', '삭제', function () { state.sets = state.sets.filter(function (x) { return x.id !== id; }); state.recent = state.recent.filter(function (r) { return r.setId !== id; }); viewSet = ''; commit(); toast('삭제했어요'); }); }
    else if (a === 't-menu') { var cs = setById(viewSet), tr = cs && cs.tracks[+t.dataset.i]; if (tr) openSheet({ type: 'tmenu', setId: cs.id, tid: tr.id }); }
    else if (a === 'cfg') { var k = t.dataset.k, v = t.dataset.v; state.settings[k] = k === 'rate' || k === 'rep' ? +v : v; commit(); }
    else if (a === 'rep-custom') openSheet({ type: 'rep' });
    else if (a === 'del-logs') confirmBox('훈련 기록 삭제', '훈련 기록을 전부 지울까요? 되돌릴 수 없어요.', '모두 삭제', function () { state.logs = {}; state.recent = []; commit(); toast('훈련 기록을 지웠어요'); });
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.id === 'cfg-goal') { state.settings.goal = cInt(el.value, 1, 600, state.settings.goal); commit(); }
    else if (el.dataset && el.dataset.mark != null && !e.target.closest('#player')) { var s = setById(viewSet); if (s && s.tracks[+el.dataset.mark]) { s.tracks[+el.dataset.mark].mark = el.checked; commit(false); } }
  });
  // 문단 설정(⋯) 시트
  var oldDraw = drawSheet;
  drawSheet = function () {
    if (sheet && sheet.type === 'tmenu') {
      var st = setById(sheet.setId), tr = st && st.tracks.filter(function (x) { return x.id === sheet.tid; })[0];
      $('#sheet').innerHTML = '<h2>' + esc(tr ? tr.name : '') + '</h2><div style="display:flex;flex-direction:column;gap:8px"><button type="button" class="btn" data-sh="t-text">자막 입력·수정</button>' + (tr && !tr.split ? '<button type="button" class="btn" data-sh="t-split">문장 단위로 나누기</button>' : '') + (tr && tr.split ? '<button type="button" class="btn" data-sh="t-merge">나눈 문단 합치기</button>' : '') + '<button type="button" class="btn danger" data-sh="t-del">이 문단 삭제</button></div><div class="sheet-f"><button type="button" class="btn" data-sh="close">닫기</button></div>';
      return;
    }
    oldDraw();
  };
  $('#scrim').addEventListener('click', function (e) {
    var b = e.target.closest('[data-sh]'); if (!b || !sheet || sheet.type !== 'tmenu') return; var a = b.dataset.sh, s = sheet, st = setById(s.setId), tr = st && st.tracks.filter(function (x) { return x.id === s.tid; })[0]; if (!tr) return;
    if (a === 't-text') openSheet({ type: 'text', setId: s.setId, tid: s.tid });
    else if (a === 't-split') openSheet({ type: 'split', setId: s.setId, tid: s.tid });
    else if (a === 't-merge') { var fid = tr.fid, first = st.tracks.findIndex(function (x) { return x.fid === fid && x.split; }); st.tracks = st.tracks.filter(function (x) { return !(x.fid === fid && x.split); }); st.tracks.splice(first, 0, { id: uid(), fid: fid, fname: tr.fname, fsize: tr.fsize, name: baseName(tr.fname).slice(0, 120), start: 0, end: 0, dur: 0, mark: false, text: '', split: false }); closeSheet(); fixDuration(st, fid); commit(); toast('하나로 합쳤어요'); }
    else if (a === 't-del') { var i = st.tracks.indexOf(tr); st.tracks.splice(i, 1); closeSheet(); commit(); toast('문단을 삭제했어요'); }
  });
  async function fixDuration(st, fid) { var rec = FILES[fid]; if (!rec) return; var d = await audioDuration(rec), t = st.tracks.filter(function (x) { return x.fid === fid && !x.split; })[0]; if (t) { t.dur = d; commit(false); render(); } }
  window.addEventListener('beforeunload', function () { if (P.open && P.setId) { try { var s = curSet(); if (s) s.last = P.idx; writeLocal(); } catch (e) {} } });

  render(); initRemote(); report(todayKey());
})();
</script>
