          <select id="nc-status">
            <option value="예정">예정</option>
            <option value="진행중">진행중</option>
          </select>
        </div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="primary sm" data-act="createComp">추가</button>
        <button class="ghost sm" data-act="cancelNewComp">취소</button>
      </div>
    </div>
  `;
  document.getElementById('nc-name').focus();
}

function createComp() {
  const name = document.getElementById('nc-name').value.trim();
  if (!name) { toast('역량명을 입력해주세요'); return; }
  const cat = document.getElementById('nc-cat').value.trim();
  const date = document.getElementById('nc-date').value;
  const status = document.getElementById('nc-status').value;
  const priority = state.competencies.length + 1;
  state.competencies.push({ id: uid(), name, category: cat, targetDate: date, status, note: '', priority });
  document.getElementById('newCompFormWrap').innerHTML = '';
  markDirty(); render(); toast('역량을 추가했어요');
}

function updateComp(id, field, value) {
  const c = state.competencies.find(c => c.id === id);
  if (!c) return;
  c[field] = value;
  markDirty(); render();
}

function deleteComp(id) {
  const c = state.competencies.find(c => c.id === id);
  askConfirm(`'${c ? c.name : '이 역량'}'과(와) 등록된 공부 목차를 모두 삭제할까요?`, '삭제', () => deleteCompNow(id));
}
function deleteCompNow(id) {
  const removedTopicIds = new Set(state.topics.filter(t => t.competencyId === id).map(t => t.id));
  state.competencies = state.competencies.filter(c => c.id !== id);
  state.topics = state.topics.filter(t => t.competencyId !== id);
  state.studyLogs.forEach(s => { if (removedTopicIds.has(s.topicId)) s.topicId = null; });
  reindexPriority();
  if (openCompId === id) openCompId = null;
  markDirty(); render(); toast('역량을 삭제했어요');
}

function reindexPriority() {
  sortedCompetencies().forEach((c, i) => { c.priority = i + 1; });
}

function moveComp(id, dir) {
  const list = sortedCompetencies();
  const idx = list.findIndex(c => c.id === id);
  const swapIdx = idx + dir;
  if (swapIdx < 0 || swapIdx >= list.length) return;
  const a = list[idx], b = list[swapIdx];
  const tmp = a.priority; a.priority = b.priority; b.priority = tmp;
  markDirty(); render();
}

function toggleComp(id) {
  openCompId = (openCompId === id) ? null : id;
  render();
}

/* ============================================================
   공부 목차(진도표) — 책 목차처럼 역량별로 공부 내용을 등록하고, 간트 차트에서 기간을 배정
   ============================================================ */
function topicsFor(compId) {
  return state.topics.filter(t => t.competencyId === compId).sort((a, b) => a.order - b.order);
}

// 상위(최상위) 공부 목차만 — 하위 목차(parentId 있음)는 제외
function topLevelTopicsFor(compId) {
  return state.topics.filter(t => t.competencyId === compId && !t.parentId).sort((a, b) => a.order - b.order);
}

// 특정 상위 목차 밑에 달린 하위 목차들
function childTopicsFor(parentId) {
  return state.topics.filter(t => t.parentId === parentId).sort((a, b) => a.order - b.order);
}

function hasChildTopics(topicId) {
  return state.topics.some(t => t.parentId === topicId);
}

// 하위 목차가 있는 상위 목차는 '완료'를 직접 체크하지 않고, 하위 목차가 모두 완료됐을 때 자동으로 완료로 본다.
function topicDoneEffective(t) {
  const kids = childTopicsFor(t.id);
  if (kids.length) return kids.every(k => k.done);
  return !!t.done;
}

function parseTopicLines(raw) {
  // CSV(콤마) 또는 줄바꿈으로 구분된 텍스트를 항목 배열로 변환. 따옴표로 감싼 값은 벗겨냄
  return raw.split(/\r?\n/)
    .flatMap(line => line.split(','))
    .map(s => s.trim().replace(/^"(.*)"$/, '$1').trim())
    .filter(Boolean);
}

function addTopicsToComp(compId, titles) {
  if (!titles.length) return 0;
  const existing = topLevelTopicsFor(compId);
  let order = existing.length ? existing[existing.length - 1].order + 1 : 1;
  titles.forEach(title => {
    state.topics.push({ id: uid(), competencyId: compId, parentId: null, order: order++, title, startDate: '', endDate: '', done: false, targetMinutes: 0, sessions: [] });
  });
  markDirty(); render();
  return titles.length;
}

function addTopicQuick(compId) {
  const input = document.getElementById('topicQuick-' + compId);
  if (!input) return;
  const title = input.value.trim();
  if (!title) return;
  addTopicsToComp(compId, [title]);
  toast('공부 내용을 추가했어요');
}

// 하위 목차(세부 목차) 추가 — 최상위 목차 하나 아래에만 달 수 있음(하위의 하위는 지원하지 않음)
function addSubTopics(parentId, titles) {
  if (!titles.length) return 0;
  const parent = state.topics.find(t => t.id === parentId);
  if (!parent) return 0;
  const gainingFirstChild = !hasChildTopics(parentId);
  const existing = childTopicsFor(parentId);
  let order = existing.length ? existing[existing.length - 1].order + 1 : 1;
  titles.forEach(title => {
    state.topics.push({ id: uid(), competencyId: parent.competencyId, parentId, order: order++, title, startDate: '', endDate: '', done: false, targetMinutes: 0, sessions: [] });
  });
  // 상위 목차가 처음으로 하위 목차를 갖게 되면, 상위 목차 자체의 날짜는 더 이상 쓰이지 않으므로 비워서
  // 간트 차트에 남아있던 예전 배치가 하위 목차 종합 막대와 헷갈리지 않도록 한다.
  if (gainingFirstChild && (parent.startDate || parent.endDate)) {
    parent.startDate = '';
    parent.endDate = '';
  }
  markDirty(); render();
  return titles.length;
}

function addSubTopicQuick(parentId) {
  const input = document.getElementById('subTopicQuick-' + parentId);
  if (!input) return;
  const title = input.value.trim();
  if (!title) return;
  addSubTopics(parentId, [title]);
  toast('하위 목차를 추가했어요');
}

function handleTopicCsvFile(evt, compId) {
  const file = evt.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const titles = parseTopicLines(String(reader.result));
    const n = addTopicsToComp(compId, titles);
    toast(n ? `CSV에서 ${n}개 목차를 추가했어요` : 'CSV에서 읽을 항목이 없어요');
  };
  reader.onerror = () => toast('CSV 파일을 읽지 못했어요');
  reader.readAsText(file);
  evt.target.value = '';
}

function updateTopic(id, field, value) {
  const t = state.topics.find(t => t.id === id);
  if (!t) return;
  t[field] = value;
  markDirty(); render();
}

function toggleTopicDone(id) {
  const t = state.topics.find(t => t.id === id);
  if (!t) return;
  t.done = !t.done;
  markDirty(); render();
}

function clearTopicSchedule(id) {
  const t = state.topics.find(t => t.id === id);
  if (!t) return;
  t.startDate = '';
  t.endDate = '';
  markDirty(); render();
}

function deleteTopic(id) {
  // 상위 목차를 지우면 그 아래 하위 목차도 함께 삭제한다(하위 목차만 따로 남을 수 없음).
  const removedIds = new Set([id, ...childTopicsFor(id).map(k => k.id)]);
  state.topics = state.topics.filter(t => !removedIds.has(t.id));
  state.studyLogs.forEach(s => { if (removedIds.has(s.topicId)) s.topicId = null; });
  if (activeTimer && removedIds.has(activeTimer.topicId)) { stopTimerTicker(); activeTimer = null; }
  if (timerModalTopicId && removedIds.has(timerModalTopicId)) timerModalTopicId = null;
  markDirty(); render();
}

function moveTopic(id, dir) {
  const t = state.topics.find(t => t.id === id);
  if (!t) return;
  const list = t.parentId ? childTopicsFor(t.parentId) : topLevelTopicsFor(t.competencyId);
  const idx = list.findIndex(x => x.id === id);
  const swapIdx = idx + dir;
  if (swapIdx < 0 || swapIdx >= list.length) return;
  const a = list[idx], b = list[swapIdx];
  const tmp = a.order; a.order = b.order; b.order = tmp;
  markDirty(); render();
}

/* ============================================================
   공부 타이머 — 공부 목차(계획) 항목별로 실제 공부 시간을 컴퓨터 시계 기준으로 기록한다.
   시작~종료 시각을 그대로 남기고, 일시정지 구간은 활동 시간(activeMs) 계산에서 뺀다.
   ============================================================ */
function nowISO() { return new Date().toISOString(); }

function formatHMS(ms) {
  const totalSec = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(totalSec / 3600), m = Math.floor((totalSec % 3600) / 60), s = totalSec % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function fmtDateTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function currentActiveMs() {
  if (!activeTimer) return 0;
  return activeTimer.segments.reduce((sum, s) => sum + ((s.end ? new Date(s.end) : new Date()) - new Date(s.start)), 0);
}

function topicSavedMs(t) {
  return (t.sessions || []).reduce((sum, s) => sum + (s.activeMs || 0), 0);
}

function topicActualMinutes(t) {
  const live = (activeTimer && activeTimer.topicId === t.id) ? currentActiveMs() : 0;
  return Math.round((topicSavedMs(t) + live) / 60000);
}

// 실제로 공부한 날짜들을 연속 구간으로 묶는다 (간트 차트에 '실행' 막대로 표시하기 위함).
// 타이머가 현재 이 항목에서 실행 중이면 오늘 날짜도 포함시켜, 종료 전에도 실행 막대가 바로 보이게 한다.
function sessionDateGroups(t) {
  const dateSet = new Set((t.sessions || []).map(s => s.date).filter(Boolean));
  if (activeTimer && activeTimer.topicId === t.id) dateSet.add(todayStr());
  const dates = Array.from(dateSet).sort();
  const groups = [];
  dates.forEach(d => {
    const last = groups[groups.length - 1];
    if (last && daysBetween(last.end, d) === 1) last.end = d;
    else groups.push({ start: d, end: d });
  });
  return groups;
}

function sessionMinutesInRange(t, start, end) {
  const ms = (t.sessions || []).filter(s => s.date >= start && s.date <= end).reduce((sum, s) => sum + (s.activeMs || 0), 0);
  return Math.round(ms / 60000);
}

// 하위 목차가 있는 상위 목차용 — 여러 하위 목차의 실제 공부 날짜를 하나로 합쳐 연속 구간으로 묶는다.
function aggregateActualGroups(children) {
  const dateSet = new Set();
  children.forEach(k => {
    (k.sessions || []).forEach(s => { if (s.date) dateSet.add(s.date); });
    if (activeTimer && activeTimer.topicId === k.id) dateSet.add(todayStr());
  });
  const dates = Array.from(dateSet).sort();
  const groups = [];
  dates.forEach(d => {
    const last = groups[groups.length - 1];
    if (last && daysBetween(last.end, d) === 1) last.end = d;
    else groups.push({ start: d, end: d });
  });
  return groups;
}

// 날짜 구간(startDate~endDate)을 현재 보이는 날짜 리스트 범위로 잘라 그리드 열 인덱스를 계산한다.
// 구간이 보이는 범위와 아예 겹치지 않으면 null을 반환한다.
function clipRangeToView(startDate, endDate, dateList) {
  const viewStart = dateList[0], viewEnd = dateList[dateList.length - 1];
  if (!startDate || !endDate || endDate < viewStart || startDate > viewEnd) return null;
  const sIdx = dateList.indexOf(startDate);
  const eIdx = dateList.indexOf(endDate);
  return { clipS: sIdx === -1 ? 0 : sIdx, clipE: eIdx === -1 ? dateList.length - 1 : eIdx };
}

function openTopicTimer(topicId) {
  timerModalTopicId = topicId;
  render();
}

function closeTimerModal() {
  timerModalTopicId = null;
  render();
}

function startTimer(topicId) {
  if (activeTimer && activeTimer.topicId !== topicId) {
    toast('다른 항목의 타이머가 실행 중이에요. 먼저 종료하거나 일시정지해주세요.');
    return;
  }
  if (!activeTimer) activeTimer = { topicId, segments: [] };
  activeTimer.segments.push({ start: nowISO(), end: null });
  startTimerTicker();
  render();
}

function pauseTimer() {
  if (!activeTimer) return;
  const seg = activeTimer.segments[activeTimer.segments.length - 1];
  if (seg && !seg.end) seg.end = nowISO();
  stopTimerTicker();
  render();
}

function resumeTimer() {
  if (!activeTimer) return;
  activeTimer.segments.push({ start: nowISO(), end: null });
  startTimerTicker();
  render();
}

function stopTimer() {
  if (!activeTimer) return;
  const seg = activeTimer.segments[activeTimer.segments.length - 1];
  if (seg && !seg.end) seg.end = nowISO();
  const t = state.topics.find(x => x.id === activeTimer.topicId);
  if (t && activeTimer.segments.length) {
    const startAt = activeTimer.segments[0].start;
    const endAt = activeTimer.segments[activeTimer.segments.length - 1].end;
    const activeMs = activeTimer.segments.reduce((sum, s) => sum + (new Date(s.end) - new Date(s.start)), 0);
    const wallMs = new Date(endAt) - new Date(startAt);
    if (!t.sessions) t.sessions = [];
    t.sessions.push({ id: uid(), date: todayStr(), startAt, endAt, pausedMs: Math.max(0, wallMs - activeMs), activeMs, manual: false });
    markDirty();
    toast('공부 시간을 저장했어요');
  }
  stopTimerTicker();
  activeTimer = null;
  render();
}

function startTimerTicker() {
  stopTimerTicker();
  timerTickHandle = setInterval(updateTimerDisplay, 1000);
  updateTimerDisplay();
}

function stopTimerTicker() {
  if (timerTickHandle) { clearInterval(timerTickHandle); timerTickHandle = null; }
}

function updateTimerDisplay() {
  if (!activeTimer) return;
  const el = document.getElementById('timerLiveElapsed');
  if (el) el.textContent = formatHMS(currentActiveMs());
  const t = state.topics.find(x => x.id === activeTimer.topicId);
  if (t) {
    const badgeEl = document.querySelector(`.gantt-bar[data-topic-id="${activeTimer.topicId}"] .gantt-bar-actual`);
    if (badgeEl) badgeEl.textContent = `⏱${durationLabel(topicActualMinutes(t))}`;
    const segEl = document.querySelector(`.gantt-bar-actual-seg.timing-live`);
    if (segEl) segEl.title = `실제 공부: ${displayDate(todayStr())} · ${durationLabel(sessionMinutesInRange(t, todayStr(), todayStr()) + Math.round(currentActiveMs() / 60000))}`;
  }
}

function addManualSession(topicId) {
  const t = state.topics.find(x => x.id === topicId);
  if (!t) return;
  const dateEl = document.getElementById('manualDate-' + topicId);
  const startEl = document.getElementById('manualStart-' + topicId);
  const endEl = document.getElementById('manualEnd-' + topicId);
  const pausedEl = document.getElementById('manualPaused-' + topicId);
  if (!dateEl || !startEl || !endEl) return;
  const date = dateEl.value, startT = startEl.value, endT = endEl.value;
  const pausedMin = parseInt(pausedEl.value, 10) || 0;
  if (!date || !startT || !endT) { toast('날짜와 시작·종료 시각을 모두 입력해주세요'); return; }
  const startAt = new Date(`${date}T${startT}:00`).toISOString();
  let endAt = new Date(`${date}T${endT}:00`).toISOString();
  if (new Date(endAt) <= new Date(startAt)) { toast('종료 시각이 시작 시각보다 늦어야 해요'); return; }
  const wallMs = new Date(endAt) - new Date(startAt);
  const pausedMs = Math.max(0, Math.min(pausedMin * 60000, wallMs - 60000));
  const activeMs = wallMs - pausedMs;
  if (!t.sessions) t.sessions = [];
  t.sessions.push({ id: uid(), date, startAt, endAt, pausedMs, activeMs, manual: true });
  markDirty(); render(); toast('공부 기록을 추가했어요');
}

function deleteTopicSession(topicId, sessionId) {
  const t = state.topics.find(x => x.id === topicId);
  if (!t || !t.sessions) return;
  t.sessions = t.sessions.filter(s => s.id !== sessionId);
  markDirty(); render();
}

function renderTimerModal() {
  const root = document.getElementById('timerModalRoot');
  if (!root) return;
  if (!timerModalTopicId) { root.innerHTML = ''; return; }
  const t = state.topics.find(x => x.id === timerModalTopicId);
  if (!t) { timerModalTopicId = null; root.innerHTML = ''; return; }
  const comp = state.competencies.find(c => c.id === t.competencyId);
  const sessions = (t.sessions || []).slice().sort((a,b) => (b.startAt||'').localeCompare(a.startAt||''));
  const isRunningThis = activeTimer && activeTimer.topicId === t.id && activeTimer.segments.length && !activeTimer.segments[activeTimer.segments.length-1].end;
  const isPausedThis = activeTimer && activeTimer.topicId === t.id && !isRunningThis;
  const liveMs = (activeTimer && activeTimer.topicId === t.id) ? currentActiveMs() : 0;
  const totalMinutes = topicActualMinutes(t);
  const pct = t.targetMinutes ? Math.min(100, Math.round(totalMinutes / t.targetMinutes * 100)) : null;

  const sessionRow = (s) => `
    <div class="timer-session-row">
      <div>
        <div class="ts-range">${fmtDateTime(s.startAt)} ~ ${fmtDateTime(s.endAt)}${s.manual ? ' <span class="tag">수기</span>' : ''}</div>
        <div class="ts-active">${durationLabel(Math.round((s.activeMs||0)/60000))} 공부${s.pausedMs ? ` · 일시정지 ${Math.round(s.pausedMs/60000)}분 제외` : ''}</div>
      </div>
      <button class="g-del" data-act="deleteTopicSession" data-args='["${t.id}","${s.id}"]' title="삭제">✕</button>
    </div>`;

  root.innerHTML = `
    <div class="modal-backdrop">
      <div class="modal-card timer-modal" data-act="noop">
        <div class="modal-head">
          <div>
            <h3>${esc(t.title)}</h3>
            <div class="modal-sub">${comp ? esc(comp.name) : ''}${t.startDate && t.endDate ? ' · 계획 ' + topicRangeLabel(t) : ' · 미배치'}</div>
          </div>
          <button class="ghost sm" data-act="closeTimerModal">✕ 닫기</button>
        </div>

        <div class="timer-display">
          <div class="timer-big" id="timerLiveElapsed">${formatHMS(liveMs)}</div>
          <div class="timer-state-label">${isRunningThis ? '진행 중' : isPausedThis ? '일시정지됨' : '대기 중'}</div>
        </div>

        <div class="timer-controls">
          ${(!activeTimer || activeTimer.topicId !== t.id) ? `<button class="primary" data-act="startTimer" data-args='["${t.id}"]'>▶ 시작</button>` : ''}
          ${isRunningThis ? `<button class="ghost" data-act="pauseTimer">⏸ 일시정지</button><button class="primary" data-act="stopTimer">■ 종료하고 저장</button>` : ''}
          ${isPausedThis ? `<button class="primary" data-act="resumeTimer">▶ 재개</button><button class="ghost" data-act="stopTimer">■ 종료하고 저장</button>` : ''}
        </div>

        <div class="field" style="margin:14px 0;">
          <label>목표 시간 (이 항목 전체)</label>
          ${(() => { const {h,m} = hmPair(t.targetMinutes||0); return `
          <div class="hm-pair">
            <input type="number" class="hm-h" min="0" max="99" value="${h}" data-chg="onTopicTargetChange" data-chg-args='["${t.id}"]' id="targetH-${t.id}"><span class="unit">시간</span>
            <input type="number" class="hm-m" min="0" max="59" value="${m}" data-chg="onTopicTargetChange" data-chg-args='["${t.id}"]' id="targetM-${t.id}"><span class="unit">분</span>
          </div>`; })()}
        </div>

        <div class="timer-total">총 공부한 시간: <b>${durationLabel(totalMinutes)}</b>${pct !== null ? ` / 목표 ${durationLabel(t.targetMinutes)} (${pct}%)` : ''}</div>

        <h4>기록</h4>
        <div class="timer-session-list">
          ${sessions.length ? sessions.map(sessionRow).join('') : `<div class="empty-note">아직 기록된 공부 시간이 없어요. 타이머를 쓰거나 아래에서 수기로 추가해보세요.</div>`}
        </div>

        <h4>수기로 기록 추가</h4>
        <div class="timer-manual-form">
          <div class="field"><label>날짜</label><input type="date" id="manualDate-${t.id}" value="${todayStr()}"></div>
          <div class="field"><label>시작 시각</label><input type="time" id="manualStart-${t.id}"></div>
          <div class="field"><label>종료 시각</label><input type="time" id="manualEnd-${t.id}"></div>
          <div class="field"><label>일시정지(분)</label><input type="number" id="manualPaused-${t.id}" min="0" value="0"></div>
          <button class="sm primary" type="button" data-act="addManualSession" data-args='["${t.id}"]'>+ 기록 추가</button>
        </div>
      </div>
    </div>`;
}

function noop() {}

function applyTopicTargetFromInputs(topicId, hId, mId) {
  const t = state.topics.find(x => x.id === topicId);
  const hEl = document.getElementById(hId);
  const mEl = document.getElementById(mId);
  if (!t || !hEl || !mEl) return;
  const h = parseInt(hEl.value, 10) || 0;
  const m = parseInt(mEl.value, 10) || 0;
  t.targetMinutes = h * 60 + m;
  markDirty(); render();
}

// 타이머 모달 안의 목표 시간 입력칸에서 호출됨
function onTopicTargetChange(topicId) {
  applyTopicTargetFromInputs(topicId, 'targetH-' + topicId, 'targetM-' + topicId);
}

// '역량 관리' 탭의 공부 목차 목록에서 곧바로 목표 시간을 먼저 정할 때 호출됨(타이머를 열지 않아도 됨)
function onTopicTargetChangeCT(topicId) {
  applyTopicTargetFromInputs(topicId, 'ctTargetH-' + topicId, 'ctTargetM-' + topicId);
}

function topicsForDate(date) {
  return state.topics.filter(t => t.startDate && t.endDate && t.startDate <= date && t.endDate >= date);
}

function topicAlreadyInStudy(topicId, date) {
  return state.studyLogs.some(s => s.topicId === topicId && s.date === date);
}

function addStudyLogFromTopic(topicId, forDate) {
  const t = state.topics.find(t => t.id === topicId);
  if (!t) return;
  const date = forDate || t.startDate;
  if (!date) return;
  if (topicAlreadyInStudy(t.id, date)) { toast('이미 오늘의 공부에 추가됐어요'); return; }
  state.studyLogs.push({ id: uid(), date, content: t.title, competencyId: t.competencyId, targetMinutes: 0, actualMinutes: 0, actualContent: '', done: false, topicId: t.id });
  markDirty(); render(); toast('오늘의 공부에 추가했어요');
}

/* ============================================================
   데이터 내보내기 / 불러오기 / 샘플 / 초기화
   ============================================================ */
async function exportData() {
  const payload = { version: 1, exportedAt: new Date().toISOString(), state };
  const stamp0 = todayStr().replaceAll('-','');
  if (capDownloads) {
    try {
      await capDownloads.save({ filename: `역량플래너_${stamp0}.json`, data: JSON.stringify(payload, null, 2) });
      toast('JSON 파일로 저장했어요');
    } catch (e) {
      if (!e || e.code !== 'declined') showAlert('이 화면에서는 파일 저장이 안 돼요. 데이터는 계정에 자동 저장되고 있어요.');
    }
    return;
  }
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = todayStr().replaceAll('-','');
  a.href = url; a.download = `역량플래너_${stamp}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  if (!capDb) { dirty = false; document.getElementById('dirtyBanner').style.display = 'none'; }
  toast('JSON 파일로 저장했어요');
}

function importData(evt) {
  const file = evt.target.files[0];
  if (!file) return;
  const hasData = state.competencies.length || state.topics.length || state.studyLogs.length;
  if (hasData) {
    askConfirm('불러오면 지금 데이터가 파일 내용으로 바뀌어요. 계속할까요?', '불러오기', () => importDataNow(evt, file), () => { evt.target.value = ''; });
    return;
  }
  importDataNow(evt, file);
}
function importDataNow(evt, file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      const incoming = parsed.state || parsed;
      if (!incoming || !Array.isArray(incoming.competencies)) throw new Error('형식 오류');
      if (!Array.isArray(incoming.studyLogs)) incoming.studyLogs = []; // 이전 버전 파일 호환
      if (!Array.isArray(incoming.topics)) incoming.topics = []; // 이전 버전 파일 호환
      incoming.topics.forEach(t => {
        // 이전 버전(월간/주간/일간 목표 체계, 단일 date 필드) 파일 호환 — 하루짜리 배치로 이관
        if (t.startDate === undefined || t.endDate === undefined) {
          const d = t.date || '';
          t.startDate = d; t.endDate = d;
        }
        delete t.date;
        if (typeof t.targetMinutes !== 'number') t.targetMinutes = 0; // 이전 버전 파일 호환
        if (!Array.isArray(t.sessions)) t.sessions = []; // 이전 버전 파일 호환
        t.sessions.forEach(s => {
          if (typeof s.activeMs !== 'number') {
            // activeMs 필드가 없는 이전 파일 호환 — startAt/endAt/pausedMs로부터 재계산
            const wallMs = (s.startAt && s.endAt) ? (new Date(s.endAt) - new Date(s.startAt)) : 0;
            s.activeMs = Math.max(0, wallMs - (s.pausedMs || 0));
          }
        });
        if (typeof t.parentId === 'undefined') t.parentId = null; // 이전 버전 파일 호환(하위 목차 없음)
      });
      // parentId가 가리키는 상위 목차가 실제로 없거나(파일 손상 등), 그 상위 자체도 하위 목차라서
      // 2단계 이상 중첩되는 경우 — 최상위로 끌어올려서 화면에서 사라지지 않도록 한다(1단계 중첩만 지원).
      const topicIds = new Set(incoming.topics.map(t => t.id));
      incoming.topics.forEach(t => {
        if (t.parentId && (!topicIds.has(t.parentId) || t.parentId === t.id)) t.parentId = null;
      });
      incoming.topics.forEach(t => {
        if (t.parentId) {
          const parent = incoming.topics.find(p => p.id === t.parentId);
          if (parent && parent.parentId) t.parentId = null;
        }
      });
      delete incoming.goals; // 이전 버전의 월간/주간/일간 목표 체계는 더 이상 사용하지 않음
      state = incoming;
      let maxN = 0;
      [...state.competencies, ...state.studyLogs, ...state.topics].forEach(o => {
        const m = /id(\d+)_/.exec(o.id || '');
        if (m) maxN = Math.max(maxN, parseInt(m[1], 10));
      });
      uidCounter = maxN + 1;
      openCompId = null;
      stopTimerTicker();
      activeTimer = null;
      timerModalTopicId = null;
      markDirty();
      render();
      toast('데이터를 불러왔어요');
    } catch (e) {
      showAlert('파일을 읽을 수 없어요. 이 앱에서 내보낸 JSON 파일인지 확인해주세요.');
    }
    evt.target.value = '';
  };
  reader.readAsText(file);
}

function clearAll() {
  askConfirm('모든 역량과 공부 목차를 삭제해요. 되돌릴 수 없어요. 계속할까요?', '전체 초기화', clearAllNow);
}
function clearAllNow() {
  state = { competencies: [], studyLogs: [], topics: [] };
  openCompId = null;
  stopTimerTicker();
  activeTimer = null;

}

function loadSample() {
  if (state.competencies.length) { askConfirm('현재 데이터에 샘플 데이터가 추가돼요. 계속할까요?', '추가', loadSampleNow); return; }

}

    { id: uid(), competencyId: t1, parentId: null, order: 4, title: '4과목 프로그래밍 언어 활용', startDate: '', endDate: '', done: false, targetMinutes: 0, sessions: [] },
    { id: uid(), competencyId: t2, parentId: null, order: 1, title: 'Unit 1 자기소개 스크립트', startDate: addDays(today, 2), endDate: addDays(today, 2), done: false, targetMinutes: 60, sessions: [] },
    // 하위 목차 예시 — 'Cafe'라는 큰 목차 밑에 세부 목차(Housing, Hobby)를 두는 경우
    { id: cafeTopicId, competencyId: t2, parentId: null, order: 2, title: 'Cafe', startDate: '', endDate: '', done: false, targetMinutes: 0, sessions: [] },
    { id: uid(), competencyId: t2, parentId: cafeTopicId, order: 1, title: 'Housing', startDate: addDays(today, 4), endDate: addDays(today, 4), done: false, targetMinutes: 40, sessions: [] },
    { id: uid(), competencyId: t2, parentId: cafeTopicId, order: 2, title: 'Hobby', startDate: addDays(today, 5), endDate: addDays(today, 6), done: false, targetMinutes: 40, sessions: [] }

    { id: uid(), date: today, content: 'OPIc 스피킹 스크립트 암기', competencyId: t2, targetMinutes: 60, actualMinutes: 0, actualContent: '', done: false, topicId: null }

/* ============================================================
   유틸 / 초기화
   ============================================================ */
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s) { return esc(s); }
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(() => el.classList.remove('show'), 2200);
}
window.addEventListener('beforeunload', (e) => {
  if (dirty && !capDb) { e.preventDefault(); e.returnValue = ''; }
});

function applyLoadedState(incoming) {
  if (!incoming || !Array.isArray(incoming.competencies)) return false;
  if (!Array.isArray(incoming.studyLogs)) incoming.studyLogs = [];
  if (!Array.isArray(incoming.topics)) incoming.topics = [];
  state = incoming;
  let maxN = 0;
  [...state.competencies, ...state.studyLogs, ...state.topics].forEach(o => {
    const m = /id(\d+)_/.exec(o.id || '');
    if (m) maxN = Math.max(maxN, parseInt(m[1], 10));
  });
  uidCounter = maxN + 1;
  return true;
}

setTab('dashboard');
(async function boot() {
  await cloudInit();
  let local = null;
  const ls = localStore();
  if (ls) { try { local = JSON.parse(ls.getItem(LOCAL_KEY)); } catch (e) {} }
  let cloud = null;
  if (capDb) {
    setSaveStatus('불러오는 중…');
    try { cloud = await cloudLoad(); } catch (e) { cloud = null; }
  }
  const pick = [cloud, local].filter(x => x && x.state).sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0))[0];
  if (pick) applyLoadedState(pick.state);
  cloudReady = true;
  if (capDb) {
    setSaveStatus('✓ 계정에 저장됨');
    if (pick && pick !== cloud) markDirty(); // 더 최신인 로컬 데이터를 계정에 반영
  }
  render();
})();
</script>
