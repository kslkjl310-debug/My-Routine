<title>독서 체크</title>
<script>
/* 허브 안에서 열렸을 때: 허브(부모 화면)에게 메시지로 부탁해서 계정 저장소를 쓰고, 다른 영역의 도구로 이동한다.
   (My Tools Hub의 다른 도구들과 같은 방식) */
(function () {
  if (window.parent === window) return;
  document.documentElement.classList.add('emb');
  var P = window.parent, seq = 0, pending = {}, subs = {};
  function post(m) { m.__hub = 1; P.postMessage(m, '*'); }
  function call(cap, op, args) {
    return new Promise(function (res, rej) {
      var id = ++seq; pending[id] = { res: res, rej: rej };
      post({ id: id, cap: cap, op: op, args: args || [] });
    });
  }
  function docSnap(d) {
    var body = d.data;
    return { id: d.id, exists: !!d.exists, metadata: d.metadata || {},
      data: function () { return body == null ? undefined : JSON.parse(JSON.stringify(body)); } };
  }
  function wrap(s) {
    if (!s) return s;
    if (s.kind === 'doc') return docSnap(s);
    var docs = (s.docs || []).map(docSnap);
    return { docs: docs, size: docs.length, empty: !docs.length, metadata: s.metadata || {}, docChanges: function () { return []; } };
  }
  window.addEventListener('message', function (e) {
    if (e.source !== P) return;
    var m = e.data; if (!m || !m.__hubr) return;
    if (m.sub) { var s = subs[m.sub]; if (!s) return; if (m.err) { if (s.err) s.err(m.err); } else s.next(wrap(m.snap)); return; }
    var p = pending[m.id]; if (!p) return; delete pending[m.id];
    if (m.err) p.rej(m.err); else p.res(m.val);
  });
  function subscribe(kind, path, lim, next, err) {
    var id = ++seq; subs[id] = { next: next, err: err };
    post({ sub: id, kind: kind, path: path, lim: lim || null });
    return function () { delete subs[id]; post({ unsub: id }); };
  }
  function docRef(path) {
    return {
      id: path.split('/').pop(), path: path,
      get: function () { return call('db', 'docGet', [path]).then(wrap); },
      set: function (d) { return call('db', 'docSet', [path, d]); },
      update: function (d) { return call('db', 'docUpdate', [path, d]); },
      'delete': function () { return call('db', 'docDel', [path]); },
      collection: function (sub) { return colRef(path + '/' + sub); },
      onSnapshot: function (next, err) { return subscribe('doc', path, null, next, err); }
    };
  }
  function colRef(path, lim) {
    return {
      path: path,
      doc: function (id) { return docRef(path + '/' + (id || (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)))); },
      limit: function (n) { return colRef(path, n); },
      get: function () { return call('db', 'colGet', [path, lim || null]).then(wrap); },
      onSnapshot: function (next, err) { return subscribe('col', path, lim, next, err); }
    };
  }
  var capsP = null;
  function caps() {
    if (!capsP) capsP = new Promise(function (res) {
      var done = false;
      call('hub', 'caps', []).then(function (c) { done = true; res(c || {}); }, function () { done = true; res({}); });
      setTimeout(function () { if (!done) res({}); }, 12000);
    });
    return capsP;
  }
  var api = {
    use: function (name) {
      return caps().then(function (c) {
        if (!c[name]) return null;
        if (name === 'db') return { doc: docRef, collection: function (p) { return colRef(p); } };
        if (name === 'user') return {
          id: function () { return call('user', 'id', []); },
          isOwner: function () { return false; }, canEdit: function () { return false; }, can: function () { return null; }
        };
        if (name === 'downloads') return { save: function (r) { return call('downloads', 'save', [{ filename: r.filename, data: r.data }]); } };
        return null;
      });
    }
  };
  window.__hubClaude = api;
  window.__hubNav = function (key) { post({ nav: key }); };
  window.__hubTools = function () { return call('hub', 'tools', []); };
  // 도구가 "오늘 이만큼 했다"는 수치를 알려 주면 허브가 계정에 남기고, 루틴이 그 수치로 자동 체크한다
  window.__hubReport = function (r) { post({ report: r }); };
})();

<style>
  /* Layout: 오늘 읽기(목표·연속·한 주) → 숫자 → 다음 기념일 → 활동 → 내 책장 → 메모 모음. 읽은 사실이 한눈에 보이고, 오늘 한 번만 누르면 되게 한다. */

<div class="wrap" id="root"></div>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div></div>

<script>
(function () {
  'use strict';

  var KEY = 'reading-check-v1';
  var STREAKS = [3, 7, 14, 21, 30, 50, 66, 100, 200, 365], BOOKS_AT = [1, 3, 5, 10, 20, 30, 50], HOURS_AT = [10, 30, 50, 100, 200, 500];
  var DOW = ['일', '월', '화', '수', '목', '금', '토'];
  var STATUS = { reading: '읽는 중', want: '읽고 싶은', done: '완독' };
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var keyOf = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var parseKey = function (k) { var p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2], 12); };
  var todayKey = function () { return keyOf(new Date()); };
  var addDays = function (k, n) { var d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
  var dowOf = function (k) { return parseKey(k).getDay(); };
  var dayDiff = function (a, b) { return Math.round((parseKey(b) - parseKey(a)) / 864e5); };
  var dotted = function (k) { return k.replace(/-/g, '.'); };
  var fmt = function (n) { return Number(n).toLocaleString('ko-KR'); };
  var isDate = function (s) { return /^\d{4}-\d{2}-\d{2}$/.test(s); };
  var clone = function (o) { return JSON.parse(JSON.stringify(o)); };
  var uid = function (p) { return p + Math.random().toString(36).slice(2, 9); };
  var hm = function (min) { var h = Math.floor(min / 60), m = min % 60; return h ? h + '시간' + (m ? ' ' + m + '분' : '') : m + '분'; };

  /* ---------- 상태 ---------- */
  function normalize(j) {
    j = j || {};
    var goal = j.goal || {};
    var out = { v: 1, updatedAt: j.updatedAt || 0, goal: { min: Math.max(1, +goal.min || 20), year: Math.max(1, +goal.year || 12) }, books: [], logs: [] };
    (Array.isArray(j.books) ? j.books : []).forEach(function (b) {
      if (!b || !b.title) return;
      out.books.push({
        id: String(b.id || uid('b')), title: String(b.title).slice(0, 120), author: String(b.author || '').slice(0, 80),
        pages: Math.max(0, Math.floor(+b.pages || 0)), cur: Math.max(0, Math.floor(+b.cur || 0)),
        status: STATUS[b.status] ? b.status : 'reading', start: isDate(b.start || '') ? b.start : '', end: isDate(b.end || '') ? b.end : '',
        rating: Math.min(5, Math.max(0, Math.floor(+b.rating || 0))), review: String(b.review || '').slice(0, 300)
      });
    });
    var ids = {}; out.books.forEach(function (b) { ids[b.id] = 1; });
    (Array.isArray(j.logs) ? j.logs : []).forEach(function (l) {
      if (!l || !ids[l.book] || !isDate(l.date || '') || !(+l.min >= 1)) return;
      out.logs.push({ id: String(l.id || uid('l')), book: l.book, date: l.date, min: Math.floor(+l.min), page: Math.max(0, Math.floor(+l.page || 0)), memo: String(l.memo || '').slice(0, 300) });
    });
    return out;
  }
  function readLocal() { try { var raw = localStorage.getItem(KEY); if (raw) return normalize(JSON.parse(raw)); } catch (e) {} return normalize(null); }
  function writeLocal() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  var state = readLocal();
  var shelf = 'reading', memoQ = '', memoMore = 50, sheet = null, pendingImport = null;
  var book = function (id) { return state.books.filter(function (b) { return b.id === id; })[0]; };

  /* ---------- 계산 ---------- */
  function minutesByDate() { var m = {}; state.logs.forEach(function (l) { m[l.date] = (m[l.date] || 0) + l.min; }); return m; }
  function streaks(m) {
    var k = todayKey(), n = 0;
    if (!(m[k] > 0)) k = addDays(k, -1);
    while (m[k] > 0) { n++; k = addDays(k, -1); }
    var ds = Object.keys(m).filter(function (d) { return m[d] > 0; }).sort(), best = 0, run = 0, prev = null;
    ds.forEach(function (d) { run = prev && dayDiff(prev, d) === 1 ? run + 1 : 1; if (run > best) best = run; prev = d; });
    return { cur: n, best: best };

      var lgs = bookLogs(b.id), e = eta(b), mins = bookMinutes(b.id), days = new Set(lgs.map(function (l) { return l.date; })).size;
      h = '<h2 id="sheet-title" style="overflow-wrap:anywhere">' + esc(b.title) + '</h2><p class="help" style="margin-top:-8px">' + esc(b.author || '저자 미입력') + ' · ' + STATUS[b.status] + '</p>';
      if (b.pages && b.status !== 'want') h += '<div><div class="bar' + (b.status === 'done' ? ' done' : '') + '"><i style="width:' + Math.min(100, (b.status === 'done' ? b.pages : b.cur) / b.pages * 100) + '%"></i></div><p class="help num" style="margin-top:6px">' + fmt(b.status === 'done' ? b.pages : b.cur) + ' / ' + fmt(b.pages) + '쪽</p></div>';
      h += '<div class="facts"><div class="fact"><span>읽은 기간</span><b>' + esc(period(b)) + '</b></div><div class="fact"><span>읽은 시간</span><b class="num">' + hm(mins) + '</b></div><div class="fact"><span>읽은 날</span><b class="num">' + days + '일</b></div>' +
        (e ? '<div class="fact"><span>이 속도면 완독</span><b class="num">' + dotted(e.date) + ' (' + e.left + '일 뒤)</b></div>' : '') + '</div>';
      if (b.status === 'done') {
        h += '<div class="field"><span class="lb">별점</span><div class="starp">' + [1, 2, 3, 4, 5].map(function (n) { return '<button type="button" data-act="rate" data-n="' + n + '" class="' + (n <= b.rating ? 'on' : '') + '" aria-label="' + n + '점">★</button>'; }).join('') + '</div></div>' +
          '<div class="field"><label for="rv">한줄평</label><textarea id="rv" maxlength="300" placeholder="이 책을 한 줄로 남긴다면?">' + esc(b.review) + '</textarea></div>';
      }
      h += '<div class="sheet-f">' + (b.status === 'reading' ? '<button type="button" class="btn primary" data-act="log" data-book="' + b.id + '">기록하기</button><button type="button" class="btn done" data-act="finish" data-id="' + b.id + '">완독</button>' :
        b.status === 'want' ? '<button type="button" class="btn primary" data-act="start-book" data-id="' + b.id + '">읽기 시작</button>' :
        '<button type="button" class="btn" data-act="reread" data-id="' + b.id + '">다시 읽는 중으로</button>') + '<button type="button" class="btn" data-act="edit-book" data-id="' + b.id + '">정보 수정</button><span class="sp"></span><button type="button" class="btn" data-act="close">닫기</button></div>';
      h += '<div><div class="sec-t" style="margin-bottom:6px"><h2 style="font-size:15px">읽은 기록</h2><span>' + lgs.length + '번</span></div>' + (lgs.length ? '<div class="logs">' + lgs.map(function (l) {
        return '<button type="button" class="lg" data-act="edit-log" data-id="' + l.id + '"><span class="d">' + l.date.slice(5).replace('-', '/') + '</span><span class="tx' + (l.memo ? '' : ' none') + '">' + (l.memo ? esc(l.memo) : '메모 없음') + (l.page ? ' <span style="color:var(--ink2);font-family:var(--font);font-size:12px">(' + l.page + '쪽)</span>' : '') + '</span><span class="mn num">' + l.min + '분</span></button>';
      }).join('') + '</div>' : '<p class="help">아직 기록이 없어요.</p>') + '</div>';
    } else if (s.type === 'settings') {
      h = '<h2 id="sheet-title">목표 설정</h2><div class="field"><label for="gl-min">하루 목표 (분)</label><input type="number" id="gl-min" min="1" max="600" inputmode="numeric" value="' + state.goal.min + '"><p class="help">처음엔 작게 시작하는 게 오래 가요. 하루 10~20분이면 충분해요.</p></div>' +
        '<div class="field"><label for="gl-year">올해 완독 목표 (권)</label><input type="number" id="gl-year" min="1" max="500" inputmode="numeric" value="' + state.goal.year + '"></div>' +
        '<div class="sheet-f"><button type="button" class="btn primary" data-act="goal-save">저장</button><button type="button" class="btn" data-act="close">취소</button></div>';
    }
    $('#sheet').innerHTML = h;
  }

  /* ---------- 동작 ---------- */
  var CHEER = ['좋아요, 오늘도 한 걸음 나아갔어요.', '꾸준함이 쌓이고 있어요.', '오늘의 독서 기록 완료!', '잘 읽었어요. 내일도 이어 가요.'];
  function saveLog() {
    var s = sheet, bid = $('#lg-book').value, min = Math.floor(+$('#lg-min').value), page = Math.floor(+$('#lg-page').value || 0), memo = $('#lg-memo').value.trim(), date = $('#lg-date').value, msg = $('#lg-msg');
    var b = book(bid), fin = $('#lg-fin') && $('#lg-fin').checked;
    if (!b) { msg.textContent = '책을 골라 주세요.'; return; }
    if (!(min >= 1 && min <= 1440)) { msg.textContent = '읽은 시간을 1분 이상으로 입력해 주세요.'; $('#lg-min').focus(); return; }
    if (!isDate(date) || date > todayKey()) { msg.textContent = '날짜를 확인해 주세요.'; return; }
    if (b.pages && page > b.pages) { msg.textContent = '전체 쪽수(' + b.pages + '쪽)보다 클 수 없어요.'; $('#lg-page').focus(); return; }
    var before = streaks(minutesByDate()).cur, old = s.id ? state.logs.filter(function (l) { return l.id === s.id; })[0] : null, dates = [date];
    if (old) { dates.push(old.date); old.book = bid; old.date = date; old.min = min; old.page = page; old.memo = memo; }
    else state.logs.push({ id: uid('l'), book: bid, date: date, min: min, page: page, memo: memo });
    if (page) b.cur = page;
    if (b.status === 'want') { b.status = 'reading'; b.start = b.start || date; }
    if (!b.start || date < b.start) b.start = date;
    var finished = !old && (fin || (b.pages && page >= b.pages));
    if (finished) { b.status = 'done'; b.end = date; if (b.pages) b.cur = b.pages; }
    commit(dates);
    var after = streaks(minutesByDate()).cur, hit = STREAKS.filter(function (x) { return before < x && after >= x; })[0];
    if (finished) { openSheet({ type: 'detail', id: b.id }); toast('「' + b.title + '」 완독을 축하해요! 별점과 한줄평을 남겨 보세요.', 5200); }
    else {
      closeSheet();
      var left = state.goal.min - (minutesByDate()[todayKey()] || 0);
      toast(hit ? hit + '일 연속 읽기를 달성했어요!' : CHEER[Math.floor(Math.random() * CHEER.length)] + (left > 0 && date === todayKey() ? ' 목표까지 ' + left + '분 남았어요.' : ''));
    }
  }
  function saveBook() {
    var s = sheet, title = $('#bk-title').value.trim(), msg = $('#bk-msg');
    if (!title) { msg.textContent = '제목을 입력해 주세요.'; $('#bk-title').focus(); return; }
    var st = s.status || 'reading', start = $('#bk-start').value, end = $('#bk-end').value, pages = Math.max(0, Math.floor(+$('#bk-pages').value || 0)), t = todayKey();
    if (st !== 'want' && (!isDate(start) || start > t)) { msg.textContent = '시작일을 확인해 주세요.'; return; }
    if (st === 'done' && (!isDate(end) || end > t || end < start)) { msg.textContent = '완독일은 시작일 이후여야 해요.'; return; }
    var b = s.id ? book(s.id) : { id: uid('b'), cur: 0, rating: 0, review: '' };
    b.title = title; b.author = $('#bk-author').value.trim(); b.pages = pages; b.status = st;
    b.start = st === 'want' ? '' : start; b.end = st === 'done' ? end : '';
    if (pages && b.cur > pages) b.cur = pages;
    if (st === 'done' && pages) b.cur = pages;
    if (!s.id) { state.books.push(b); shelf = st; }
    commit(); openSheet({ type: 'detail', id: b.id });
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t) { if (e.target.id === 'scrim') closeSheet(); return; }
    var act = t.dataset.act, id = t.dataset.id, b = id && book(id);
    if (act === 'shelf') { shelf = t.dataset.s; render(); }
    else if (act === 'log') openSheet({ type: 'log', book: t.dataset.book || null });
    else if (act === 'add-book') openSheet({ type: 'book', status: shelf === 'done' ? 'reading' : shelf });
    else if (act === 'open-book') openSheet({ type: 'detail', id: id });
    else if (act === 'edit-book') openSheet({ type: 'book', id: id });
    else if (act === 'close') closeSheet();
    else if (act === 'min') { $('#lg-min').value = t.dataset.n; document.querySelectorAll('#lg-chips .chip').forEach(function (c) { c.setAttribute('aria-pressed', String(c === t)); }); }
    else if (act === 'log-save') saveLog();
    else if (act === 'edit-log') openSheet({ type: 'log', id: id });
    else if (act === 'log-del') {
      if (t.dataset.armed !== '1') { t.dataset.armed = '1'; t.textContent = '정말 삭제'; return; }
      var l = state.logs.filter(function (x) { return x.id === id; })[0], bk = l && l.book;
      state.logs = state.logs.filter(function (x) { return x.id !== id; }); commit([l && l.date]); if (bk) openSheet({ type: 'detail', id: bk }); else closeSheet();
    }
    else if (act === 'bk-status') {
      sheet.status = t.dataset.s;
      document.querySelectorAll('[data-act=bk-status]').forEach(function (c) { c.setAttribute('aria-pressed', String(c === t)); });
      $('#bk-dates').hidden = sheet.status === 'want'; $('#bk-endf').hidden = sheet.status !== 'done';
    }
    else if (act === 'book-save') saveBook();
    else if (act === 'book-del') {
      if (t.dataset.armed !== '1') { t.dataset.armed = '1'; t.textContent = '정말 삭제 (기록도 함께 지워져요)'; return; }
      var ds = state.logs.filter(function (x) { return x.book === id; }).map(function (x) { return x.date; });
      state.books = state.books.filter(function (x) { return x.id !== id; }); state.logs = state.logs.filter(function (x) { return x.book !== id; });
      commit(ds); closeSheet(); toast('책을 삭제했어요');
    }
    else if (act === 'start-book' && b) { b.status = 'reading'; b.start = todayKey(); shelf = 'reading'; commit(); openSheet({ type: 'detail', id: id }); toast('읽기를 시작했어요. 첫 기록을 남겨 볼까요?'); }
    else if (act === 'finish' && b) { b.status = 'done'; b.end = todayKey(); if (!b.start) b.start = b.end; if (b.pages) b.cur = b.pages; shelf = 'done'; commit(); openSheet({ type: 'detail', id: id }); toast('「' + b.title + '」 완독을 축하해요! 별점과 한줄평을 남겨 보세요.', 5200); }
    else if (act === 'reread' && b) { b.status = 'reading'; b.end = ''; if (b.pages) b.cur = 0; shelf = 'reading'; commit(); openSheet({ type: 'detail', id: id }); }
    else if (act === 'rate') { var cb = book(sheet.id); if (cb) { cb.rating = cb.rating === +t.dataset.n ? 0 : +t.dataset.n; state.updatedAt = Date.now(); writeLocal(); schedulePush(); render(); drawSheet(); } }
    else if (act === 'settings') openSheet({ type: 'settings' });
    else if (act === 'goal-save') { state.goal.min = Math.max(1, Math.floor(+$('#gl-min').value) || 20); state.goal.year = Math.max(1, Math.floor(+$('#gl-year').value) || 12); commit(); closeSheet(); toast('목표를 저장했어요'); }
    else if (act === 'more-memo') { memoMore += 50; render(); }
    else if (act === 'export') exportBackup();
    else if (act === 'import-yes') { if (pendingImport) { var ts = state.updatedAt, dates = Object.keys(minutesByDate()); state = pendingImport.data; state.updatedAt = Math.max(Date.now(), ts + 1); pendingImport = null; commit(dates.concat(Object.keys(minutesByDate()))); toast('백업에서 복원했어요'); } }
    else if (act === 'import-no') { pendingImport = null; render(); }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'memoQ') { memoQ = e.target.value; memoMore = 50; var q = memoQ.toLowerCase(); }
    if (e.target.id === 'memoQ') {
      var notes = [];
      state.logs.forEach(function (l) { if (l.memo) { var b = book(l.book); notes.push({ date: l.date, title: b.title, text: l.memo, min: l.min }); } });
      state.books.forEach(function (b) { if (b.review) notes.push({ date: b.end || b.start || '', title: b.title, text: b.review, rv: 1 }); });
      notes.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
      $('#memos').innerHTML = memosHtml(notes.filter(function (n) { return !q || (n.title + ' ' + n.text).toLowerCase().indexOf(q) >= 0; }));
    }
    else if (e.target.id === 'rv' && sheet && sheet.type === 'detail') {
      var cb = book(sheet.id); if (cb) { cb.review = e.target.value; clearTimeout(window.__rvT); window.__rvT = setTimeout(function () { state.updatedAt = Date.now(); writeLocal(); schedulePush(); render(); }, 600); }
    }
    else if (e.target.id === 'lg-min') { var v = +e.target.value; document.querySelectorAll('#lg-chips .chip').forEach(function (c) { c.setAttribute('aria-pressed', String(+c.dataset.n === v)); }); }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'importFile' && t.files && t.files[0]) {
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var j = JSON.parse(String(fr.result || ''));
          if (!j || !Array.isArray(j.books)) throw new Error('bad');
          var data = normalize(j); pendingImport = { data: data, books: data.books.length, logs: data.logs.length }; render();
        } catch (err) { toast('읽을 수 없는 파일이에요. 내보내기로 저장한 파일을 골라 주세요.'); }
      };
      fr.readAsText(t.files[0]);
    }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#scrim').hidden) closeSheet(); });
  async function updateExportBtn() { var b = $('#exportBtn'); if (!b) return; try { var d = CL && CL.use ? await CL.use('downloads') : null; b.hidden = !d; } catch (e) { b.hidden = true; } }
  async function exportBackup() {
    try { var d = await CL.use('downloads'); await d.save({ filename: 'reading-check-' + todayKey() + '.json', data: JSON.stringify(state, null, 1) }); toast('백업 파일을 저장했어요'); }
    catch (e) { if (!e || e.code !== 'declined') toast('이 화면에서는 파일을 저장할 수 없어요'); }
  }

  render();
  initRemote();
  report(todayKey());
})();
</script>
</body>
</html>
