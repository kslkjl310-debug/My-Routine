<title>러닝 관리</title>
<script>
/* 허브 안에서 열렸을 때: 허브(부모 화면)에게 메시지로 부탁해서 계정 저장소를 쓰고, 다른 영역의 도구로 이동한다.
   (My Tools Hub의 다른 도구들과 같은 방식) */
(function () {
  if (window.parent === window) return;
  document.documentElement.classList.add('emb');
  var P = window.parent, seq = 0, pending = {}, subs = {};
  function post(m) { m.__hub = 1; P.postMessage(m, '*'); }
  function call(cap, op, args) {
    return new Promise(function (res, rej) {
      var id = ++seq; pending[id] = { res: res, rej: rej };
      post({ id: id, cap: cap, op: op, args: args || [] });
    });
  }
  function docSnap(d) {
    var body = d.data;
    return { id: d.id, exists: !!d.exists, metadata: d.metadata || {},
      data: function () { return body == null ? undefined : JSON.parse(JSON.stringify(body)); } };
  }
  function wrap(s) {
    if (!s) return s;
    if (s.kind === 'doc') return docSnap(s);
    var docs = (s.docs || []).map(docSnap);
    return { docs: docs, size: docs.length, empty: !docs.length, metadata: s.metadata || {}, docChanges: function () { return []; } };
  }
  window.addEventListener('message', function (e) {
    if (e.source !== P) return;
    var m = e.data; if (!m || !m.__hubr) return;
    if (m.sub) { var s = subs[m.sub]; if (!s) return; if (m.err) { if (s.err) s.err(m.err); } else s.next(wrap(m.snap)); return; }
    var p = pending[m.id]; if (!p) return; delete pending[m.id];
    if (m.err) p.rej(m.err); else p.res(m.val);
  });
  function subscribe(kind, path, lim, next, err) {
    var id = ++seq; subs[id] = { next: next, err: err };
    post({ sub: id, kind: kind, path: path, lim: lim || null });
    return function () { delete subs[id]; post({ unsub: id }); };
  }
  function docRef(path) {
    return {
      id: path.split('/').pop(), path: path,
      get: function () { return call('db', 'docGet', [path]).then(wrap); },
      set: function (d) { return call('db', 'docSet', [path, d]); },
      update: function (d) { return call('db', 'docUpdate', [path, d]); },
      'delete': function () { return call('db', 'docDel', [path]); },
      collection: function (sub) { return colRef(path + '/' + sub); },
      onSnapshot: function (next, err) { return subscribe('doc', path, null, next, err); }
    };
  }
  function colRef(path, lim) {
    return {
      path: path,
      doc: function (id) { return docRef(path + '/' + (id || (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)))); },
      limit: function (n) { return colRef(path, n); },
      get: function () { return call('db', 'colGet', [path, lim || null]).then(wrap); },
      onSnapshot: function (next, err) { return subscribe('col', path, lim, next, err); }
    };
  }
  var capsP = null;
  function caps() {
    if (!capsP) capsP = new Promise(function (res) {
      var done = false;
      call('hub', 'caps', []).then(function (c) { done = true; res(c || {}); }, function () { done = true; res({}); });
      setTimeout(function () { if (!done) res({}); }, 12000);
    });
    return capsP;
  }
  var api = {
    use: function (name) {
      return caps().then(function (c) {
        if (!c[name]) return null;
        if (name === 'db') return { doc: docRef, collection: function (p) { return colRef(p); } };
        if (name === 'user') return {
          id: function () { return call('user', 'id', []); },
          isOwner: function () { return false; }, canEdit: function () { return false; }, can: function () { return null; }
        };
        if (name === 'downloads') return { save: function (r) { return call('downloads', 'save', [{ filename: r.filename, data: r.data }]); } };
        return null;
      });
    }
  };
  window.__hubClaude = api;
  window.__hubNav = function (key) { post({ nav: key }); };
  window.__hubTools = function () { return call('hub', 'tools', []); };
  // 도구가 "오늘 이만큼 했다"는 수치를 알려 주면 허브가 계정에 남기고, 루틴이 그 수치로 자동 체크한다
  window.__hubReport = function (r) { post({ report: r }); };
})();

<script>
(function () {
  'use strict';

  var KEY = 'running-check-v1';
  var DOW = ['일', '월', '화', '수', '목', '금', '토'];
  var FEEL = ['힘들었어요', '무거웠어요', '보통이에요', '가벼웠어요', '최고였어요'];
  var PLAN_KINDS = { easy: 1, long: 1, tempo: 1, interval: 1, rp: 1 };
  var hrOk = function (v) { v = +v; return v >= 60 && v <= 230 ? Math.round(v) : 0; };
  var paceOk = function (v) { v = +v; return v >= 150 && v <= 900 ? Math.round(v) : 0; };
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };

    var chk = (merged.km != null && merged.sec != null && merged.pace != null && Math.abs(merged.sec / merged.km - merged.pace) > merged.pace * 0.15) ? ' 거리·시간·페이스가 서로 맞지 않아요. 사진과 비교해 확인해 주세요.' : '';
    var miss = []; if (merged.km == null) miss.push('거리'); if (merged.sec == null) miss.push('시간');
    msg.textContent = got.length ? '읽은 값: ' + got.join(' · ') + '.' + (miss.length ? ' ' + miss.join('·') + '는 못 읽었어요. 직접 입력해 주세요.' : '') + ' 사진과 같은지 확인한 뒤 저장해 주세요.' + chk
      : '숫자를 읽지 못했어요. 거리와 시간이 크게 보이는 결과 화면을 캡처해서 다시 골라 보시거나 직접 입력해 주세요.';
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t) { if (e.target.id === 'scrim') closeSheet(); return; }
    var act = t.dataset.act, id = t.dataset.id;
    if (act === 'log') openSheet({ type: 'log' });
    else if (act === 'edit') openSheet({ type: 'log', id: id });
    else if (act === 'close') closeSheet();
    else if (act === 'km') { $('#rn-km').value = t.dataset.n; updatePace(); }
    else if (act === 'feel') { var on = sheet.feel === +t.dataset.n; sheet.feel = on ? 0 : +t.dataset.n; document.querySelectorAll('[data-act=feel]').forEach(function (c) { c.setAttribute('aria-pressed', String(+c.dataset.n === sheet.feel)); }); }
    else if (act === 'save') saveRun();
    else if (act === 'del') {
      if (t.dataset.armed !== '1') { t.dataset.armed = '1'; t.textContent = '정말 삭제'; return; }
      var r = state.runs.filter(function (x) { return x.id === id; })[0];
      state.runs = state.runs.filter(function (x) { return x.id !== id; }); commit([r && r.date]); closeSheet(); toast('기록을 삭제했어요');
    }
    else if (act === 'goal') openSheet({ type: 'goal' });
    else if (act === 'plan') { var wsel = weekStart(todayKey()); openSheet({ type: 'plan', ws: t.dataset.ws === 'next' ? addDays(wsel, 7) : wsel }); }
    else if (act === 'plan-save') savePlan();
    else if (act === 'plan-redo') { sheet.draft = null; if (state.plans[sheet.ws]) { var keep = state.plans[sheet.ws]; state.plans[sheet.ws] = { days: {}, at: 0 }; drawSheet(); state.plans[sheet.ws] = keep; } else drawSheet(); }
    else if (act === 'pmove') openSheet({ type: 'move', from: t.dataset.d });
    else if (act === 'pmoveto') {
      var wsm = weekStart(sheet.from), pm = state.plans[wsm], it2 = pm.days[sheet.from], to = t.dataset.d;
      pm.days[to] = it2; delete pm.days[sheet.from]; commit([sheet.from, to]); closeSheet(); toast(dshort(sheet.from) + ' 러닝을 ' + dshort(to) + '로 옮겼어요.');
    }
    else if (act === 'goal-save') saveGoal();
    else if (act === 'gdist') { var n = +t.dataset.n; $('#gl-dist').value = n > 0 ? n : ''; if (!(n > 0)) { setTimeInputs(0); $('#gl-pace-in').value = ''; } updateGoalPace(n > 0 && parseMS($('#gl-pace-in').value) ? 'pace' : ''); }
    else if (act === 'goal-adopt') { var sg = +t.dataset.sec; if (sg > 0) { state.goal.targetSec = sg; commit(dayDates()); toast('목표를 ' + timeTxt(sg) + '로 바꿨어요. 상황이 좋아지면 다시 올려요.'); } }
    else if (act === 'gweek') { sheet.perWeek = +t.dataset.n; document.querySelectorAll('[data-act=gweek]').forEach(function (c) { c.setAttribute('aria-pressed', String(+c.dataset.n === sheet.perWeek)); }); }
    else if (act === 'more') { showAll = true; render(); }
    else if (act === 'export') exportBackup();
    else if (act === 'import-yes') { if (pendingImport) { var ts = state.updatedAt, ds = Object.keys(kmByDate()); state = pendingImport.data; state.updatedAt = Math.max(Date.now(), ts + 1); pendingImport = null; commit(ds.concat(Object.keys(kmByDate()))); toast('백업에서 복원했어요'); } }
    else if (act === 'import-no') { pendingImport = null; render(); }
  });
  document.addEventListener('input', function (e) { if (/^rn-(km|min|sec)$/.test(e.target.id)) updatePace(); else if (e.target.id === 'gl-pace-in') updateGoalPace('pace'); else if (/^gl-(dist|h|m|s)$/.test(e.target.id)) updateGoalPace('time'); else if (/^pl-m-/.test(e.target.id)) updatePlanTotal(); });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.pdate) { // 종류를 바꾸면 거리 칸을 맞춰 준다: 휴식이면 비우고, 처음 고르면 코치 제안 거리를 넣는다
      var mi = $('#pl-m-' + t.dataset.pdate);
      if (t.value === 'rest') mi.value = ''; else if (!(+mi.value > 0)) mi.value = { easy: 4, tempo: 5, long: 8, interval: 5, rp: 5 }[t.value] || 4;
      updatePlanTotal(); return;
    }
    if (t.id === 'rn-shot' && t.files && t.files.length) { readShots(Array.prototype.slice.call(t.files, 0, 4)); t.value = ''; return; }
    if (t.id === 'importFile' && t.files && t.files[0]) {
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var j = JSON.parse(String(fr.result || ''));
          if (!j || !Array.isArray(j.runs)) throw new Error('bad');
          var data = normalize(j); pendingImport = { data: data, n: data.runs.length }; render();
        } catch (err) { toast('읽을 수 없는 파일이에요. 내보내기로 저장한 파일을 골라 주세요.'); }
      };
      fr.readAsText(t.files[0]);
    }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#scrim').hidden) closeSheet(); });
  async function updateExportBtn() { var b = $('#exportBtn'); if (!b) return; try { var d = CL && CL.use ? await CL.use('downloads') : null; b.hidden = !d; } catch (e) { b.hidden = true; } }
  async function exportBackup() {
    try { var d = await CL.use('downloads'); await d.save({ filename: 'running-check-' + todayKey() + '.json', data: JSON.stringify(state, null, 1) }); toast('백업 파일을 저장했어요'); }
    catch (e) { if (!e || e.code !== 'declined') toast('이 화면에서는 파일을 저장할 수 없어요'); }
  }

  render();
  initRemote();
  reportWeeks();
})();
</script>
</body>
</html>
